<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cazzu</title>
<meta name="description" content="&quot;Escaneá. Escuchá. Repetí.&quot; — ScanBeat">
<meta property="og:site_name" content="ScanBeat">
<meta property="og:title" content="Cazzu">
<meta property="og:description" content="&quot;Escaneá. Escuchá. Repetí.&quot; — ScanBeat">
<meta property="og:image" content="https://scanbeat.com.ar/cards/cazzu-discografia/covers/cover-2qazT8MwkUsaEvDik9he9z.jpg">
<meta property="og:url" content="https://scanbeat.com.ar/cards/cazzu-discografia/">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0f0c29">
<style>
  :root{
    --bg1:#1a1a2e; --bg2:#16213e; --accent:#e94560; --accent2:#ffd166; --text:#ffffff;
  }
  html[data-theme="cumpleanos"]{ --bg1:#3a0d5c; --bg2:#7b2d8e; --accent:#ff6fb5; --accent2:#ffd166; }
  html[data-theme="fiesta"]{ --bg1:#0f0c29; --bg2:#302b63; --accent:#00f5d4; --accent2:#f15bb5; }
  html[data-theme="evento"]{ --bg1:#0b0b0b; --bg2:#1c1c1c; --accent:#d4af37; --accent2:#ffffff; }
  html[data-theme="regalo"]{ --bg1:#5c0011; --bg2:#8e0e3a; --accent:#ff8fa3; --accent2:#ffd166; }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; min-height:100%; width:100%;
    background:radial-gradient(circle at 50% 0%, var(--bg2), var(--bg1));
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text);
  }
  header{ text-align:center; padding:48px 20px 12px; }
  h1{
    margin:0; font-size:clamp(24px,6vw,36px); font-weight:800;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    line-height:1.2;
  }
  .subtitle{ margin:8px 0 0; font-size:13px; opacity:.6; text-transform:uppercase; letter-spacing:.1em; }
  .intro{
    max-width:520px; margin:20px auto 0; font-size:clamp(13px,3.4vw,15px); line-height:1.9;
    font-family:Georgia,'Times New Roman',serif; letter-spacing:.04em; font-weight:400; opacity:.88;
  }
  .yt-link{
    display:inline-flex; align-items:center; gap:6px; margin-top:14px; text-decoration:none;
    color:var(--text); background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.22);
    padding:8px 16px; border-radius:20px; font-size:13px; font-weight:600;
  }
  .yt-link small{ font-size:10px; font-weight:400; opacity:.65; text-transform:uppercase; }

  .list{ max-width:560px; margin:0 auto; padding:24px 16px 60px; display:flex; flex-direction:column; gap:14px; }

  .album{
    background:rgba(255,255,255,.05); border-radius:16px; padding:14px;
  }
  .album-head{ display:flex; gap:14px; align-items:center; }
  .album-cover{
    width:76px; height:76px; flex-shrink:0; border-radius:10px; background-color:var(--accent);
    background-size:cover; background-position:center top; box-shadow:0 8px 20px rgba(0,0,0,.4);
  }
  .album-info{ flex:1; min-width:0; }
  .album-title{ font-size:15px; font-weight:700; line-height:1.3; }
  .album-year{ font-size:12px; opacity:.55; margin-top:2px; }
  .album-links{ display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .album-link{
    display:inline-flex; align-items:center; gap:6px;
    font-size:13px; font-weight:700; color:var(--text); text-decoration:none;
    background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.25);
    padding:8px 14px; border-radius:20px;
  }

  details.tracklist{
    margin-top:12px; background:rgba(255,255,255,.06); border-radius:14px; padding:4px 14px;
  }
  details.tracklist summary{
    cursor:pointer; padding:12px 0; font-weight:700; font-size:14px; list-style:none;
  }
  .track-list{ margin:0 0 12px; text-align:left; }
  .track-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 0; border-bottom:1px solid rgba(255,255,255,.08);
  }
  .track-row:last-child{ border-bottom:none; }
  .track-num{ opacity:.5; font-size:11px; width:18px; flex-shrink:0; }
  .track-title{ font-size:13px; opacity:.9; flex:1; }
  .track-play{
    flex-shrink:0; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.22);
    color:var(--text); border-radius:20px; padding:4px 10px; font-size:11px; cursor:pointer;
  }
  .track-embed{ display:none; padding:6px 0 10px 18px; }
  .track-embed.open{ display:block; }
  .track-embed iframe{ width:100%; border-radius:10px; border:none; }

  .more-albums{ max-width:560px; margin:0 auto; padding:0 16px 8px; }
  .more-albums .more-label{
    margin:4px 0 12px; font-size:12px; opacity:.55; text-transform:uppercase; letter-spacing:.08em;
    text-align:center;
  }
  .more-list{ display:flex; flex-direction:column; gap:2px; }
  .more-row{
    display:flex; align-items:baseline; justify-content:space-between; gap:10px;
    padding:10px 4px; border-bottom:1px solid rgba(255,255,255,.08);
  }
  .more-row:last-child{ border-bottom:none; }
  .more-title{ font-size:13px; font-weight:600; opacity:.9; }
  .more-year{ font-size:11px; opacity:.5; margin-left:6px; }
  .more-links{ display:flex; gap:10px; flex-shrink:0; }
  .more-links a{ font-size:12px; font-weight:700; color:var(--accent2); text-decoration:none; }

  .brand-footer{ text-align:center; padding:4px 20px 48px; opacity:.75; }
  .brand-footer .domain{ color:var(--text); text-decoration:none; font-size:13px; font-weight:700; }
  .brand-footer .slogan{ margin:6px 0 0; font-size:12px; font-style:italic; opacity:.8; }
</style>
</head>
<body>
<header>
  <h1>Cazzu</h1>
  <p class="subtitle">Discografía</p>
  <p class="intro"></p>
  <div id="ytLinkWrap"></div>
</header>

<div class="list" id="list"></div>

<div class="more-albums" id="moreAlbums"></div>

<footer class="brand-footer">
  <a class="domain" href="https://scanbeat.com.ar" target="_blank" rel="noopener">🌐 scanbeat.com.ar</a>
  <p class="slogan">"Escaneá. Escuchá. Repetí."</p>
</footer>

<script>
  document.documentElement.setAttribute('data-theme', "fiesta");

  const YOUTUBE_URL = "https://www.youtube.com/@cazzu";
  if(YOUTUBE_URL){
    document.getElementById('ytLinkWrap').innerHTML =
      `<a class="yt-link" href="${YOUTUBE_URL}" target="_blank" rel="noopener">▶ Canal oficial de YouTube<small>sin cuenta</small></a>`;
  }

  const ALBUMS = [{"titulo":"Maldade$","anio":"2017","spotifyUrl":"https://open.spotify.com/album/2qazT8MwkUsaEvDik9he9z","tidalUrl":"","appleMusicUrl":"","cover":"./covers/cover-2qazT8MwkUsaEvDik9he9z.jpg","tracks":[{"title":"Más","spotifyId":"09rCwhwFUotOg3Eu9ML9Nc"},{"title":"El Don","spotifyId":"5FLGhIR2WSAlxmJdFZImG0"},{"title":"Maldade$","spotifyId":"0pxdZOkKRrtDM1vpco67cL"},{"title":"Killa","spotifyId":"6n4k1y87m5uPE5SJ4vB7P1"},{"title":"Fantasías","spotifyId":"1ne2BvqM4if1Ezss4mWmfj"},{"title":"Trucos","spotifyId":"1myS4AalgYarHPgzR0BXQl"},{"title":"Trampa Bitch","spotifyId":"28Xu52XovHJu6jsHHAZJfj"},{"title":"Kaiosama","spotifyId":"4ZqD8vB5qZcHUZU5XjnSwl"},{"title":"R.i.p","spotifyId":"45jxyiCA6E13w75wW1oixN"},{"title":"Hello Bitche$","spotifyId":"0jDsJC4y4dl8udZ6QgCqkt"}]},{"titulo":"Error 93","anio":"2019","spotifyUrl":"https://open.spotify.com/album/5zbO01D6uIqC2ejQSQEN2O","tidalUrl":"","appleMusicUrl":"","cover":"./covers/cover-5zbO01D6uIqC2ejQSQEN2O.jpg","tracks":[{"title":"Visto a las 00:00","spotifyId":"0m1zfGk4oYfj4NxBLNheHZ"},{"title":"Mucha Data","spotifyId":"57x0IGrEHEdoy5QMBlcitJ"},{"title":"Rally","spotifyId":"2ARn3G25of5dL50KuRhysK"},{"title":"Penas y Problemas","spotifyId":"0qqnsZeoW0ZdpyaW50cuNh"},{"title":"Mentiste","spotifyId":"2xoBzKUr7zr7N9uK0tkVTO"},{"title":"Al Revés","spotifyId":"0gBAyjARi1aLOrUiXEAVmF"},{"title":"Ya No Quiero","spotifyId":"7LPDImEAE4BbuOAa2AIkvd"},{"title":"Fuego","spotifyId":"6a9g8wT59D7UgBrLSOvc7J"},{"title":"Nada","spotifyId":"7DOh0tBGnyMt6C5OO7o8Yq"},{"title":"La Clase","spotifyId":"5nLJL6DLanZaAq8DVkBs62"}]},{"titulo":"Nena Trampa","anio":"2022","spotifyUrl":"https://open.spotify.com/album/6hPsRT5cjxpBOgMfIupL48","tidalUrl":"","appleMusicUrl":"","cover":"./covers/cover-6hPsRT5cjxpBOgMfIupL48.jpg","tracks":[{"title":"Jefa","spotifyId":"1K2h9Y50wXiRsENQHLydZO"},{"title":"Nena Trampa","spotifyId":"2wjA6V7u0rLcFehcty11aN"},{"title":"Isla Velde","spotifyId":"7G9uS8qTQjEnhP5huKomCb"},{"title":"Yo Yo y Yo","spotifyId":"2dMp9jC7cpEj9wY8FQ8GMa"},{"title":"Piensame","spotifyId":"2i4GPmdILmtWx8pESvKME0"},{"title":"Peli-Culeo","spotifyId":"2pEmxGe9nMIjg8wniWkYjJ"},{"title":"Fulete","spotifyId":"1vuwe8zD8zY4CrNIsUwdQe"},{"title":"La Trampa","spotifyId":"4thRlSvG4x4TWKmvy9n9Fz"},{"title":"Maléfica","spotifyId":"0U9OZFbn82oICL2jNbpNHy"},{"title":"Los Hombres No Lloran","spotifyId":"7jzMyl5FmJWNnYsoRn4Sg5"}]},{"titulo":"Latinaje","anio":"2025","spotifyUrl":"https://open.spotify.com/album/6ilEhVQVT7DnbBjDMBnzNs","tidalUrl":"","appleMusicUrl":"","cover":"./covers/cover-6ilEhVQVT7DnbBjDMBnzNs.jpg","tracks":[{"title":"Copla","spotifyId":"0kTI5jZ7FPMvoqnHPGlpXh"},{"title":"Mala Suerte","spotifyId":"59Hg9EqA8kEW2pmDNjyIWU"},{"title":"Me Tocó Perder","spotifyId":"0PVDEaIjTCC7NDeLfnxQi4"},{"title":"Dolce","spotifyId":"2Uq9wCOwiisxLKXLoRBnz1"},{"title":"La Cueva","spotifyId":"2Sh8PZtvrJtOx6m2H4ziZs"},{"title":"Ódiame","spotifyId":"1gmFHuhCkXY1jGmscYdvIJ"},{"title":"Pobrecito Mi Patrón","spotifyId":"5C7VXFv82ntKqRB6uyPumh"},{"title":"Con Otra","spotifyId":"2F6PBqz7aPA7K309aFKMHt"},{"title":"Engreído","spotifyId":"2q38VvSrZyMt5Mr68VQXxw"},{"title":"Que Disparen","spotifyId":"0SgftEgzmRLtYHJ9mARvgD"},{"title":"Inti","spotifyId":"0IaW6NFaem0rcjxH3ZYZqs"},{"title":"Ahora","spotifyId":"5NEIbBrXaTZ9UG8hRAOLhz"},{"title":"Una Loca Enamorada","spotifyId":"30yrwMYz42QhcNJ9JKwB4s"},{"title":"Menú de Degustación","spotifyId":"6vqcSBecrgiyIIEMvxSPkA"}]}];

  function esc(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function renderTrackRow(track, albumIndex, trackIndex){
    const num = String(trackIndex + 1).padStart(2, '0');
    const embedId = `track-embed-${albumIndex}-${trackIndex}`;
    return `<div class="track-row">
        <span class="track-num">${num}</span>
        <span class="track-title">${esc(track.title)}</span>
        <button class="track-play" data-spotify-id="${track.spotifyId}" data-embed="${embedId}">▶ Escuchar</button>
      </div>
      <div class="track-embed" id="${embedId}"></div>`;
  }

  function renderAlbum(a, i){
    const tracksHtml = Array.isArray(a.tracks) && a.tracks.length
      ? `<details class="tracklist">
          <summary>Ver los ${a.tracks.length} temas</summary>
          <div class="track-list">${a.tracks.map((t, j) => renderTrackRow(t, i, j)).join('')}</div>
        </details>`
      : '';
    const links = [
      a.spotifyUrl ? { url: a.spotifyUrl, label: 'Spotify' } : null,
      a.tidalUrl ? { url: a.tidalUrl, label: 'Tidal' } : null,
      a.appleMusicUrl ? { url: a.appleMusicUrl, label: 'Apple Music' } : null,
    ].filter(Boolean).map(l =>
      `<a class="album-link" href="${l.url}" target="_blank" rel="noopener">▶ ${l.label}</a>`
    ).join('');
    return `<div class="album">
        <div class="album-head">
          <div class="album-cover" style="${a.cover ? `background-image:url('${a.cover}')` : ''}"></div>
          <div class="album-info">
            <div class="album-title">${esc(a.titulo)}</div>
            <div class="album-year">${esc(a.anio)}</div>
            <div class="album-links">${links}</div>
          </div>
        </div>
        ${tracksHtml}
      </div>`;
  }

  const list = document.getElementById('list');
  list.innerHTML = ALBUMS.map((a, i) => renderAlbum(a, i)).join('');

  const MORE_ALBUMS = [];
  if(Array.isArray(MORE_ALBUMS) && MORE_ALBUMS.length){
    function renderMoreRow(a){
      const links = [
        a.spotifyUrl ? { url: a.spotifyUrl, label: 'Spotify' } : null,
        a.tidalUrl ? { url: a.tidalUrl, label: 'Tidal' } : null,
        a.appleMusicUrl ? { url: a.appleMusicUrl, label: 'Apple Music' } : null,
      ].filter(Boolean).map(l => `<a href="${l.url}" target="_blank" rel="noopener">${l.label}</a>`).join('');
      return `<div class="more-row">
          <span class="more-title">${esc(a.titulo)}<span class="more-year">${esc(a.anio)}</span></span>
          <span class="more-links">${links}</span>
        </div>`;
    }
    document.getElementById('moreAlbums').innerHTML = `
      <p class="more-label">Más discos</p>
      <div class="more-list">${MORE_ALBUMS.map(renderMoreRow).join('')}</div>`;
  }

  list.addEventListener('click', (e) => {
    const btn = e.target.closest('.track-play');
    if(!btn) return;
    const embed = document.getElementById(btn.dataset.embed);
    if(embed.classList.contains('open')){
      embed.classList.remove('open');
      embed.innerHTML = '';
      return;
    }
    document.querySelectorAll('.track-embed.open').forEach(el => { el.classList.remove('open'); el.innerHTML = ''; });
    embed.innerHTML = `<iframe src="https://open.spotify.com/embed/track/${btn.dataset.spotifyId}?utm_source=generator" height="152" allow="encrypted-media" loading="lazy"></iframe>`;
    embed.classList.add('open');
  });
</script>
</body>
</html>
