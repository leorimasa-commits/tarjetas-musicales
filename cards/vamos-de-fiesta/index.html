<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>¡Vamos de fiesta! 🎉</title>
<style>
  :root{
    --bg1:#1a1a2e; --bg2:#16213e; --accent:#e94560; --accent2:#ffd166; --text:#ffffff;
  }
  html[data-theme="cumpleanos"]{ --bg1:#3a0d5c; --bg2:#7b2d8e; --accent:#ff6fb5; --accent2:#ffd166; }
  html[data-theme="fiesta"]{ --bg1:#0f0c29; --bg2:#302b63; --accent:#00f5d4; --accent2:#f15bb5; }
  html[data-theme="evento"]{ --bg1:#0b0b0b; --bg2:#1c1c1c; --accent:#d4af37; --accent2:#ffffff; }
  html[data-theme="regalo"]{ --bg1:#5c0011; --bg2:#8e0e3a; --accent:#ff8fa3; --accent2:#ffd166; }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background:radial-gradient(circle at 50% 20%, var(--bg2), var(--bg1));
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text); overflow:hidden;
  }
  .stage{
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    padding:24px; gap:18px;
  }
  .emoji{ font-size:56px; filter:drop-shadow(0 4px 12px rgba(0,0,0,.4)); }
  h1{
    margin:0; font-size:clamp(22px,6vw,34px); font-weight:800;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    line-height:1.2; max-width:90vw;
  }
  .subtitle{ margin:0; opacity:.85; font-size:14px; letter-spacing:.08em; text-transform:uppercase; }
  .message{
    margin:0; max-width:520px; font-size:clamp(15px,4vw,18px); line-height:1.5; opacity:.92;
    white-space:pre-wrap;
  }
  .vinyl{
    width:150px; height:150px; border-radius:50%;
    background:
      radial-gradient(circle at center, #111 0 18%, #222 19% 21%, #111 22% 100%),
      repeating-radial-gradient(circle at center, #000 0 2px, #1a1a1a 2px 6px);
    box-shadow:0 10px 30px rgba(0,0,0,.5);
    display:flex; align-items:center; justify-content:center;
    animation: spin 4s linear infinite; animation-play-state: paused;
  }
  .vinyl.playing{ animation-play-state: running; }
  .vinyl-center{
    width:22px; height:22px; border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .bars{ display:flex; align-items:flex-end; gap:4px; height:26px; }
  .bars span{
    width:4px; background:linear-gradient(180deg,var(--accent2),var(--accent));
    border-radius:2px; animation: bar 900ms ease-in-out infinite; animation-play-state:paused;
  }
  .bars.playing span{ animation-play-state:running; }
  .bars span:nth-child(1){ height:40%; animation-delay:0ms; }
  .bars span:nth-child(2){ height:100%; animation-delay:120ms; }
  .bars span:nth-child(3){ height:60%; animation-delay:240ms; }
  .bars span:nth-child(4){ height:85%; animation-delay:360ms; }
  .bars span:nth-child(5){ height:50%; animation-delay:480ms; }
  @keyframes bar{ 0%,100%{ transform:scaleY(.4);} 50%{ transform:scaleY(1);} }

  .tap-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.55); backdrop-filter:blur(2px);
    display:flex; align-items:center; justify-content:center; z-index:20;
    animation: pulse-bg 2s ease-in-out infinite;
  }
  .tap-btn{
    display:flex; flex-direction:column; align-items:center; gap:10px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#111; font-weight:800; font-size:18px; border:none;
    padding:22px 34px; border-radius:20px; cursor:pointer;
    box-shadow:0 10px 30px rgba(0,0,0,.4); animation: pop 1.4s ease-in-out infinite;
  }
  .tap-btn .icon{ font-size:34px; }
  @keyframes pop{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.06);} }
  @keyframes pulse-bg{ 0%,100%{ background:rgba(0,0,0,.55);} 50%{ background:rgba(0,0,0,.7);} }

  .confetti{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:1; }
  .confetti span{
    position:absolute; top:-10%; font-size:20px; opacity:.8;
    animation: fall linear infinite;
  }
  @keyframes fall{
    to{ transform:translateY(120vh) rotate(360deg); opacity:.2; }
  }

  .mini-controls{
    position:fixed; bottom:18px; left:0; right:0; display:flex; justify-content:center; gap:16px; z-index:5;
  }
  .mini-controls button{
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25); color:var(--text);
    width:42px; height:42px; border-radius:50%; font-size:16px; cursor:pointer;
  }
  .hidden{ display:none !important; }
</style>
</head>
<body>
<div class="confetti" id="confetti"></div>

<div class="stage">
  <div class="emoji">🎉</div>
  <p class="subtitle"></p>
  <h1>¡Vamos de fiesta! 🎉</h1>
  <div class="vinyl" id="vinyl"><div class="vinyl-center"></div></div>
  <div class="bars" id="bars">
    <span></span><span></span><span></span><span></span><span></span>
  </div>
  <p class="message"></p>
</div>

<div class="tap-overlay" id="tapOverlay">
  <button class="tap-btn" id="tapBtn">
    <span class="icon">🎵</span>
    Toca para escuchar
  </button>
</div>

<div class="mini-controls hidden" id="miniControls">
  <button id="toggleBtn">⏸</button>
</div>

<audio id="audio" src="./song.wav" preload="auto" loop playsinline></audio>

<script>
  document.documentElement.setAttribute('data-theme', "fiesta");

  const audio = document.getElementById('audio');
  const overlay = document.getElementById('tapOverlay');
  const tapBtn = document.getElementById('tapBtn');
  const vinyl = document.getElementById('vinyl');
  const bars = document.getElementById('bars');
  const miniControls = document.getElementById('miniControls');
  const toggleBtn = document.getElementById('toggleBtn');

  function onPlaying(){
    overlay.classList.add('hidden');
    miniControls.classList.remove('hidden');
    vinyl.classList.add('playing');
    bars.classList.add('playing');
    toggleBtn.textContent = '⏸';
    spawnConfetti();
  }
  function onPaused(){
    vinyl.classList.remove('playing');
    bars.classList.remove('playing');
    toggleBtn.textContent = '▶';
  }

  audio.addEventListener('playing', onPlaying);
  audio.addEventListener('pause', onPaused);

  // Intenta autoplay apenas carga (funciona seguido si se llegó por un tap/click real, como al escanear QR o leer NFC)
  const tryAutoplay = () => {
    audio.play().then(() => {
      overlay.classList.add('hidden');
    }).catch(() => {
      overlay.classList.remove('hidden');
    });
  };
  window.addEventListener('DOMContentLoaded', tryAutoplay);

  tapBtn.addEventListener('click', () => {
    audio.play().catch(()=>{});
  });

  toggleBtn.addEventListener('click', () => {
    if(audio.paused){ audio.play().catch(()=>{}); } else { audio.pause(); }
  });

  const EMOJIS = ["🎉","🎶","✨","🎉"];
  function spawnConfetti(){
    const wrap = document.getElementById('confetti');
    for(let i=0;i<28;i++){
      const s = document.createElement('span');
      s.textContent = EMOJIS[Math.floor(Math.random()*EMOJIS.length)];
      s.style.left = Math.random()*100 + 'vw';
      s.style.animationDuration = (3 + Math.random()*3) + 's';
      s.style.animationDelay = (Math.random()*2) + 's';
      s.style.fontSize = (14 + Math.random()*16) + 'px';
      wrap.appendChild(s);
      setTimeout(()=>s.remove(), 7000);
    }
  }
</script>
</body>
</html>
