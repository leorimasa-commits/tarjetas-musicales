<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Patricio Rey y sus Redonditos de Ricota — Imprimible</title>
<style>
  :root{
    --bg1:#1a1a2e; --bg2:#16213e; --accent:#e94560; --accent2:#ffd166; --text:#ffffff;
  }
  html[data-theme="cumpleanos"]{ --bg1:#3a0d5c; --bg2:#7b2d8e; --accent:#ff6fb5; --accent2:#ffd166; }
  html[data-theme="fiesta"]{ --bg1:#0f0c29; --bg2:#302b63; --accent:#00f5d4; --accent2:#f15bb5; }
  html[data-theme="evento"]{ --bg1:#0b0b0b; --bg2:#1c1c1c; --accent:#d4af37; --accent2:#ffffff; }
  html[data-theme="regalo"]{ --bg1:#5c0011; --bg2:#8e0e3a; --accent:#ff8fa3; --accent2:#ffd166; }

  * { box-sizing: border-box; }
  body{
    margin:0; padding:24px; background:#e5e5e5;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-wrap:wrap; gap:24px; justify-content:center;
  }
  /* Tamaño real de tarjeta de crédito (ISO/IEC 7810 ID-1): 8.56cm x 5.4cm */
  .card{
    width:8.56cm; height:5.4cm; border-radius:0.3cm; overflow:hidden; position:relative;
    background:linear-gradient(160deg, var(--bg2), var(--bg1));
    color:var(--text); display:flex; align-items:center; gap:0.35cm;
    padding:0.3cm 0.35cm; box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  .info{
    flex:1; min-width:0; display:flex; flex-direction:column; align-items:flex-start; gap:0.12cm;
  }
  .cover{
    width:1.7cm; height:1.7cm; border-radius:5px; object-fit:cover;
    box-shadow:0 3px 6px rgba(0,0,0,.4); background:var(--accent); flex-shrink:0;
  }
  .titulo{
    font-size:9.5pt; font-weight:800; line-height:1.15; margin:0;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .instruccion{
    font-size:6.5pt; font-weight:600; opacity:.85; margin:0;
  }
  .qr-box{
    background:#fff; padding:0.15cm; border-radius:6px; flex-shrink:0;
  }
  .qr-box img{ width:3.7cm; height:3.7cm; display:block; }
  .cut-guide{
    position:absolute; inset:1px; border:1px dashed rgba(255,255,255,.25);
    border-radius:0.3cm; pointer-events:none;
  }

  @media print{
    body{ background:#fff; padding:0; gap:0; }
    .card{ box-shadow:none; page-break-inside:avoid; }
    .cut-guide{ border-color:#ccc; }
  }
</style>
</head>
<body>
<div class="card">
  <div class="cut-guide"></div>
  <div class="info">
    <img class="cover" src="" alt="">
    <p class="titulo">Patricio Rey y sus Redonditos de Ricota</p>
    <p class="instruccion">📱 Escaneá para escuchar</p>
  </div>
  <div class="qr-box">
    <img src="./qr.png" alt="QR">
  </div>
</div>
<script>
  document.documentElement.setAttribute('data-theme', "regalo");
</script>
</body>
</html>
