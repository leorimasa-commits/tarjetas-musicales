<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Michael Jackson</title>
<style>
  :root{
    --bg1:#1a1a2e; --bg2:#16213e; --accent:#e94560; --accent2:#ffd166; --text:#ffffff;
  }
  html[data-theme="cumpleanos"]{ --bg1:#3a0d5c; --bg2:#7b2d8e; --accent:#ff6fb5; --accent2:#ffd166; }
  html[data-theme="fiesta"]{ --bg1:#0f0c29; --bg2:#302b63; --accent:#00f5d4; --accent2:#f15bb5; }
  html[data-theme="evento"]{ --bg1:#0b0b0b; --bg2:#1c1c1c; --accent:#d4af37; --accent2:#ffffff; }
  html[data-theme="regalo"]{ --bg1:#5c0011; --bg2:#8e0e3a; --accent:#ff8fa3; --accent2:#ffd166; }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; min-height:100%; width:100%;
    background:radial-gradient(circle at 50% 0%, var(--bg2), var(--bg1));
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text);
  }
  header{ text-align:center; padding:48px 20px 12px; }
  h1{
    margin:0; font-size:clamp(24px,6vw,36px); font-weight:800;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    line-height:1.2;
  }
  .subtitle{ margin:8px 0 0; font-size:13px; opacity:.6; text-transform:uppercase; letter-spacing:.1em; }
  .intro{
    max-width:520px; margin:20px auto 0; font-size:clamp(13px,3.4vw,15px); line-height:1.9;
    font-family:Georgia,'Times New Roman',serif; letter-spacing:.04em; font-weight:400; opacity:.88;
  }
  .yt-link{
    display:inline-flex; align-items:center; gap:6px; margin-top:14px; text-decoration:none;
    color:var(--text); background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.22);
    padding:8px 16px; border-radius:20px; font-size:13px; font-weight:600;
  }
  .yt-link small{ font-size:10px; font-weight:400; opacity:.65; text-transform:uppercase; }

  .list{ max-width:560px; margin:0 auto; padding:24px 16px 60px; display:flex; flex-direction:column; gap:14px; }

  .album{
    background:rgba(255,255,255,.05); border-radius:16px; padding:14px;
  }
  .album-head{ display:flex; gap:14px; align-items:center; }
  .album-cover{
    width:76px; height:76px; flex-shrink:0; border-radius:10px; background-color:var(--accent);
    background-size:cover; background-position:center; box-shadow:0 8px 20px rgba(0,0,0,.4);
  }
  .album-info{ flex:1; min-width:0; }
  .album-title{ font-size:15px; font-weight:700; line-height:1.3; }
  .album-year{ font-size:12px; opacity:.55; margin-top:2px; }
  .album-link{
    display:inline-flex; align-items:center; gap:6px; margin-top:8px;
    font-size:14px; font-weight:700; color:var(--text); text-decoration:none;
    background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.25);
    padding:8px 16px; border-radius:20px;
  }

  details.tracklist{
    margin-top:12px; background:rgba(255,255,255,.06); border-radius:14px; padding:4px 14px;
  }
  details.tracklist summary{
    cursor:pointer; padding:12px 0; font-weight:700; font-size:14px; list-style:none;
  }
  .track-list{ margin:0 0 12px; text-align:left; }
  .track-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 0; border-bottom:1px solid rgba(255,255,255,.08);
  }
  .track-row:last-child{ border-bottom:none; }
  .track-num{ opacity:.5; font-size:11px; width:18px; flex-shrink:0; }
  .track-title{ font-size:13px; opacity:.9; flex:1; }
  .track-play{
    flex-shrink:0; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.22);
    color:var(--text); border-radius:20px; padding:4px 10px; font-size:11px; cursor:pointer;
  }
  .track-embed{ display:none; padding:6px 0 10px 18px; }
  .track-embed.open{ display:block; }
  .track-embed iframe{ width:100%; border-radius:10px; border:none; }
</style>
</head>
<body>

minal - 2012 Remaster","spotifyId":"5T7ywazdGIydr6JCW6t02j"},{"title":"Leave Me Alone - 2012 Remaster","spotifyId":"6pJSulm9EBmsYGnp3uaEFl"}]},{"titulo":"Dangerous","anio":"1991","spotifyUrl":"https://open.spotify.com/album/0oX4SealMgNXrvRDhqqOKg","cover":"./covers/cover-7.jpg","tracks":[{"title":"Jam","spotifyId":"2EI8uljBPaI23VUr2tv4eS"},{"title":"Why You Wanna Trip on Me","spotifyId":"3kFMRdbxcBkPopY8mMFmSU"},{"title":"In the Closet","spotifyId":"5Fy40smNxk0j5OpFMtvfaU"},{"title":"She Drives Me Wild","spotifyId":"6yLdWiAkS1ZUrTdgm0yKXL"},{"title":"Remember the Time","spotifyId":"4jnFqNWeJCeCRHc4HCdxfd"},{"title":"Can't Let Her Get Away","spotifyId":"75yYXB96tX1BlSMgL0SMsA"},{"title":"Heal the World","spotifyId":"7woW97CfcWaKtuC6W5BP2K"},{"title":"Black or White","spotifyId":"7EsjkelQuoUlJXEw7SeVV4"},{"title":"Who Is It","spotifyId":"4HWcWgleTuUAWnVPNwW4CM"},{"title":"Give In to Me","spotifyId":"1euDTbMNRPNfKd8zZz4zTT"},{"title":"Will You Be There","spotifyId":"1igW25R8lnb5ze9GWbuVsl"},{"title":"Keep the Faith","spotifyId":"4J4B9TrVrvQVS6GRPtaxrA"},{"title":"Gone Too Soon","spotifyId":"66mXHPRfAwbnNKnTCNpytj"},{"title":"Dangerous","spotifyId":"3u4RKvwDT3CKeYbjxqXEye"}]},{"titulo":"HIStory: Past, Present and Future, Book I","anio":"1995","spotifyUrl":"https://open.spotify.com/album/3OBhnTLrvkoEEETjFA3Qfk","cover":"./covers/cover-8.jpg","tracks":[{"title":"Billie Jean","spotifyId":"6vR5u5b8JeRESx5nZaIWx6"},{"title":"The Way You Make Me Feel","spotifyId":"541jTq3SOEELKvcfA0jHI0"},{"title":"Black or White","spotifyId":"62ECYqWLwhndUSjfVdpSPc"},{"title":"Rock With You","spotifyId":"5yxIenY5kSLlgTr3XGYw9p"},{"title":"She's Out Of My Life","spotifyId":"1UpdFu6w98DuTMW8twhT6D"},{"title":"Bad","spotifyId":"3FvQH46A4B37eNHjooIXcu"},{"title":"I Just Can't Stop Loving You","spotifyId":"4yD5hKvrw3L6sRJbzgaFwe"},{"title":"Man in the Mirror","spotifyId":"2u2udGmop1z67EPpr91km7"},{"title":"Thriller","spotifyId":"1A1eQ01CbtSZeyxj6489IS"},{"title":"Beat It","spotifyId":"52xaypL0Kjzk0ngwv3oBPR"},{"title":"The Girl Is Mine (with Paul McCartney)","spotifyId":"6ccHuWQAQhdZ0JCFlTHvNM"},{"title":"Remember the Time","spotifyId":"6RQgvscK17WsaMj3N5RTer"},{"title":"Don't Stop 'Til You Get Enough","spotifyId":"1883SZ1i4AIgtCFQ1KaK8t"},{"title":"Wanna Be Startin' Somethin'","spotifyId":"4VpjW9LiXpwuPPVyfSbRtd"},{"title":"Heal the World","spotifyId":"5zGsHa3XcLmDAsdt0LwYnu"},{"title":"Scream","spotifyId":"4LD5dhQ3kqpqe14sGPDtBC"},{"title":"They Don't Care About Us","spotifyId":"3wuCCNCnBhJlwkIJTBZFiv"},{"title":"Stranger in Moscow","spotifyId":"64KrFHj9p5AyCX2yZQr4YJ"},{"title":"This Time Around","spotifyId":"6U6Cr0sQTmuvPqEs8iLgPn"},{"title":"Earth Song","spotifyId":"4GCGH6TJ69neckwITeBFXK"},{"title":"D.S.","spotifyId":"7roNDDmU52OYgYwCN9SI8E"},{"title":"Money","spotifyId":"2VCSO1mqWPALcPbEQwgSd3"},{"title":"Come Together","spotifyId":"3tE5OfatEheU3L5nSpW9FD"},{"title":"You Are Not Alone","spotifyId":"3AoeaZs8dFemFJr3JdzOL0"},{"title":"Childhood - Theme from \"Free Willy 2\"","spotifyId":"1Cfx6KBsyF0tEKbZbS4faj"},{"title":"Tabloid Junkie","spotifyId":"7n6DnNdKKhjyDa1GlGgLeQ"},{"title":"2 Bad","spotifyId":"5Bw9bAHGaykCFLP0VyqNbJ"},{"title":"History","spotifyId":"1EdzLQKCE066beJkDfaagd"},{"title":"Little Susie / Pie Jesu","spotifyId":"0nxdtEWLQeLcJ2IQwDftAU"},{"title":"Smile","spotifyId":"1iin2Ll8PHPzoh6xF6LQRh"}]},{"titulo":"Invincible","anio":"2001","spotifyUrl":"https://open.spotify.com/album/52E4RP7XDzalpIrOgSTgiQ","cover":"./covers/cover-9.jpg","tracks":[{"title":"Unbreakable","spotifyId":"5L9anTQJGLyRObYDYvLWdh"},{"title":"Heartbreaker","spotifyId":"0L0wNdB2KJjQrymVBkMnAq"},{"title":"Invincible","spotifyId":"4HK6hmgMwGXHo3lUUNkiem"},{"title":"Break of Dawn","spotifyId":"5UHM8Z6GXhaB6RUlBemByI"},{"title":"Heaven Can Wait","spotifyId":"1AZXNAVDD9ZFIEKySgflFz"},{"title":"You Rock My World","spotifyId":"1Lhwn4PqeGpM4LTVUowW76"},{"title":"Butterflies","spotifyId":"0rT9f5BSZrZ6DvzfBEckG0"},{"title":"Speechless","spotifyId":"1O1LkHTi3Lep9OHE8BvOVe"},{"titl   function esc(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function renderTrackRow(track, albumIndex, trackIndex){
    const num = String(trackIndex + 1).padStart(2, '0');
    const embedId = `track-embed-${albumIndex}-${trackIndex}`;
    return `<div class="track-row">
        <span class="track-num">${num}</span>
        <span class="track-title">${esc(track.title)}</span>
        <button class="track-play" data-spotify-id="${track.spotifyId}" data-embed="${embedId}">▶ Escuchar</button>
      </div>
      <div class="track-embed" id="${embedId}"></div>`;
  }

  function renderAlbum(a, i){
    const tracksHtml = Array.isArray(a.tracks) && a.tracks.length
      ? `<details class="tracklist">
          <summary>Ver los ${a.tracks.length} temas</summary>
          <div class="track-list">${a.tracks.map((t, j) => renderTrackRow(t, i, j)).join('')}</div>
        </details>`
      : '';
    return `<div class="album">
        <div class="album-head">
          <div class="album-cover" style="${a.cover ? `background-image:url('${a.cover}')` : ''}"></div>
          <div class="album-info">
            <div class="album-title">${esc(a.titulo)}</div>
            <div class="album-year">${esc(a.anio)}</div>
            <a class="album-link" href="${a.spotifyUrl}" target="_blank" rel="noopener">▶ Escuchar en Spotify</a>
          </div>
        </div>
        ${tracksHtml}
      </div>`;
  }

  const list = document.getElementById('list');
  list.innerHTML = ALBUMS.map((a, i) => renderAlbum(a, i)).join('');

  list.addEventListener('click', (e) => {
    const btn = e.target.closest('.track-play');
    if(!btn) return;
    const embed = document.getElementById(btn.dataset.embed);
    if(embed.classList.contains('open')){
      embed.classList.remove('open');
      embed.innerHTML = '';
      return;
    }
    document.querySelectorAll('.track-embed.open').forEach(el => { el.classList.remove('open'); el.innerHTML = ''; });
    embed.innerHTML = `<iframe src="https://open.spotify.com/embed/track/${btn.dataset.spotifyId}?utm_source=generator" height="152" allow="encrypted-media" loading="lazy"></iframe>`;
    embed.classList.add('open');
  });
</script>
</body>
</html>
