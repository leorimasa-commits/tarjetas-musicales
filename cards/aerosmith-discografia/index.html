<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aerosmith</title>
<meta name="description" content="&quot;Escaneá. Escuchá. Repetí.&quot; — ScanBeat">
<meta property="og:site_name" content="ScanBeat">
<meta property="og:title" content="Aerosmith">
<meta property="og:description" content="&quot;Escaneá. Escuchá. Repetí.&quot; — ScanBeat">
<meta property="og:image" content="https://scanbeat.com.ar/cards/aerosmith-discografia/covers/cover-4POwouNbBP807ciWs9WIfM.jpg">

<meta property="og:type" content="website">
<meta name="theme-color" content="#5c0011">
<style>
  :root{
    --bg1:#1a1a2e; --bg2:#16213e; --accent:#e94560; --accent2:#ffd166; --text:#ffffff;
  }
  html[data-theme="cumpleanos"]{ --bg1:#3a0d5c; --bg2:#7b2d8e; --accent:#ff6fb5; --accent2:#ffd166; }
  html[data-theme="fiesta"]{ --bg1:#0f0c29; --bg2:#302b63; --accent:#00f5d4; --accent2:#f15bb5; }
  html[data-theme="evento"]{ --bg1:#0b0b0b; --bg2:#1c1c1c; --accent:#d4af37; --accent2:#ffffff; }
  html[data-theme="regalo"]{ --bg1:#5c0011; --bg2:#8e0e3a; --accent:#ff8fa3; --accent2:#ffd166; }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; min-height:100%; width:100%;
    background:radial-gradient(circle at 50% 0%, var(--bg2), var(--bg1));
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text);
  }
  header{ text-align:center; padding:48px 20px 12px; }
  h1{
    margin:0; font-size:clamp(24px,6vw,36px); font-weight:800;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    line-height:1.2;
  }
  .subtitle{ margin:8px 0 0; font-size:13px; opacity:.6; text-transform:uppercase; letter-spacing:.1em; }
  .intro{
    max-width:520px; margin:20px auto 0; font-size:clamp(13px,3.4vw,15px); line-height:1.9;
    font-family:Georgia,'Times New Roman',serif; letter-spacing:.04em; font-weight:400; opacity:.88;
  }
  .yt-link{
    display:inline-flex; align-items:center; gap:6px; margin-top:14px; text-decoration:none;
    color:var(--text); background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.22);
    padding:8px 16px; border-radius:20px; font-size:13px; font-weight:600;
  }
  .yt-link small{ font-size:10px; font-weight:400; opacity:.65; text-transform:uppercase; }

  .list{ max-width:560px; margin:0 auto; padding:24px 16px 60px; display:flex; flex-direction:column; gap:14px; }

  .album{
    background:rgba(255,255,255,.05); border-radius:16px; padding:14px;
  }
  .album-head{ display:flex; gap:14px; align-items:center; }
  .album-cover{
    width:76px; height:76px; flex-shrink:0; border-radius:10px; background-color:var(--accent);
    background-size:cover; background-position:center top; box-shadow:0 8px 20px rgba(0,0,0,.4);
  }
  .album-info{ flex:1; min-width:0; }
  .album-title{ font-size:15px; font-weight:700; line-height:1.3; }
  .album-year{ font-size:12px; opacity:.55; margin-top:2px; }
  .album-links{ display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .album-link{
    display:inline-flex; align-items:center; gap:6px;
    font-size:13px; font-weight:700; color:var(--text); text-decoration:none;
    background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.25);
    padding:8px 14px; border-radius:20px;
  }

  details.tracklist{
    margin-top:12px; background:rgba(255,255,255,.06); border-radius:14px; padding:4px 14px;
  }
  details.tracklist summary{
    cursor:pointer; padding:12px 0; font-weight:700; font-size:14px; list-style:none;
  }
  .track-list{ margin:0 0 12px; text-align:left; }
  .track-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 0; border-bottom:1px solid rgba(255,255,255,.08);
  }
  .track-row:last-child{ border-bottom:none; }
  .track-num{ opacity:.5; font-size:11px; width:18px; flex-shrink:0; }
  .track-title{ font-size:13px; opacity:.9; flex:1; }
  .track-play{
    flex-shrink:0; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.22);
    color:var(--text); border-radius:20px; padding:4px 10px; font-size:11px; cursor:pointer;
  }
  .track-embed{ display:none; padding:6px 0 10px 18px; }
  .track-embed.open{ display:block; }
  .track-embed iframe{ width:100%; border-radius:10px; border:none; }

  .more-albums{ max-width:560px; margin:0 auto; padding:0 16px 8px; }
  .more-albums .more-label{
    margin:4px 0 12px; font-size:12px; opacity:.55; text-transform:uppercase; letter-spacing:.08em;
    text-align:center;
  }
  .more-list{ display:flex; flex-direction:column; gap:2px; }
  .more-row{
    display:flex; align-items:baseline; justify-content:space-between; gap:10px;
    padding:10px 4px; border-bottom:1px solid rgba(255,255,255,.08);
  }
  .more-row:last-child{ border-bottom:none; }
  .more-title{ font-size:13px; font-weight:600; opacity:.9; }
  .more-year{ font-size:11px; opacity:.5; margin-left:6px; }
  .more-links{ display:flex; gap:10px; flex-shrink:0; }
  .more-links a{ font-size:12px; font-weight:700; color:var(--accent2); text-decoration:none; }

  .brand-footer{ text-align:center; padding:4px 20px 48px; opacity:.75; }
  .brand-footer .domain{ color:var(--text); text-decoration:none; font-size:13px; font-weight:700; }
  .brand-footer .slogan{ margin:6px 0 0; font-size:12px; font-style:italic; opacity:.8; }
</style>
</head>
<body>
<header>
  <h1>Aerosmith</h1>
  <p class="subtitle">Discografía</p>
  <p class="intro"></p>
  <div id="ytLinkWrap"></div>
</header>

<div class="list" id="list"></div>

<div class="more-albums" id="moreAlbums"></div>

<footer class="brand-footer">
  <a class="domain" href="https://scanbeat.com.ar" target="_blank" rel="noopener">🌐 scanbeat.com.ar</a>
  <p class="slogan">"Escaneá. Escuchá. Repetí."</p>
</footer>

<script>
  document.documentElement.setAttribute('data-theme', "regalo");

  const YOUTUBE_URL = "https://www.youtube.com/@aerosmith";
  if(YOUTUBE_URL){
    document.getElementById('ytLinkWrap').innerHTML =
      `<a class="yt-link" href="${YOUTUBE_URL}" target="_blank" rel="noopener">▶ Canal oficial de YouTube<small>sin cuenta</small></a>`;
  }

  const ALBUMS = [{"titulo":"Aerosmith","anio":"1973","spotifyUrl":"https://open.spotify.com/album/4POwouNbBP807ciWs9WIfM","tidalUrl":"","appleMusicUrl":"","cover":"./covers/cover-4POwouNbBP807ciWs9WIfM.jpg","tracks":[{"title":"Make It","spotifyId":"7h5Mq5AbVZIM4zSq3tNb9m"},{"title":"Somebody","spotifyId":"7gm7mFJJOsoErW8de0TSkW"},{"title":"Dream On","spotifyId":"3tAQNhm1o0kzldsI5QkrB1"},{"title":"One Way Street","spotifyId":"32KLuTM4Zzf829n37b8zAb"},{"title":"Mama Kin","spotifyId":"0QLY2hh6yQG9lIjBqH3hUF"},{"title":"Write Me a Letter","spotifyId":"15PRyz8IXBoWcLUDsoxETh"},{"title":"Movin' Out","spotifyId":"5j3MWlNaJOsCX808UFKx7R"},{"title":"Walkin' The Dog","spotifyId":"1gYtkhvB8SML9s51wOCmOE"}]},{"titulo":"Toys in the Attic","anio":"1975","spotifyUrl":"https://open.spotify.com/album/6As5aOEQjfxLIChIB3fQRD","tidalUrl":"","appleMusicUrl":"","cover":"./covers/cover-6As5aOEQjfxLIChIB3fQRD.jpg","tracks":[{"title":"Toys In The Attic","spotifyId":"4e4ukCLCov1UYoup2SdRHB"},{"title":"Uncle Salty","spotifyId":"6VusCNdJNC771v9B5JS2Sc"},{"title":"Adam's Apple","spotifyId":"4p3RAb1HkCRugbC8LGSP2K"},{"title":"Walk This Way","spotifyId":"4JfuiOWlWCkjP6OKurHjSn"},{"title":"Big Ten Inch Record","spotifyId":"74jtieTD4GbZSwfCfmaFxz"},{"title":"Sweet Emotion","spotifyId":"73TxYZd0lBCVRrHawrAglA"},{"title":"No More No More","spotifyId":"7a9b2uPIeLUynTk6zmqacV"},{"title":"Round And Round","spotifyId":"1u50Imus5qrvYl4xTLXq5p"},{"title":"You See Me Crying","spotifyId":"7eYjJjUrbxRz97KQY5tzCP"}]},{"titulo":"Rocks","anio":"1976","spotifyUrl":"https://open.spotify.com/album/4ldiyfqRvKiIasHHuDftuP","tidalUrl":"","appleMusicUrl":"","cover":"./covers/cover-4ldiyfqRvKiIasHHuDftuP.jpg","tracks":[{"title":"Back In the Saddle","spotifyId":"3WPYapjyqcVpShYXQuChcs"},{"title":"Last Child","spotifyId":"3Kx6oHPQxtA5aJzcZeuE7r"},{"title":"Rats In The Cellar","spotifyId":"6xPmS8ol9p0JhOtWoODjZM"},{"title":"Combination","spotifyId":"0b4nzqHtFuOkRpz82nNST9"},{"title":"Sick As A Dog","spotifyId":"3HiIGUTiUaEpdagPy3MWUk"},{"title":"Nobody's Fault","spotifyId":"3Pu5aCn5aIAPx628zh8K1G"},{"title":"Get The Lead Out","spotifyId":"2h1HSscYy1HdtUcDwxrsM4"},{"title":"Lick And A Promise","spotifyId":"75gOrYf9UyLZnMyFNZiji1"},{"title":"Home Tonight","spotifyId":"0Vi6uYPn8XlNnoiOHlnzld"}]},{"titulo":"Permanent Vacation","anio":"1987","spotifyUrl":"https://open.spotify.com/album/3XYqOJI1YlX40kJTdzFEzp","tidalUrl":"","appleMusicUrl":"","cover":"./covers/cover-3XYqOJI1YlX40kJTdzFEzp.jpg","tracks":[{"title":"Heart's Done Time","spotifyId":"5REt2kiJHspMMJI9ITq135"},{"title":"Magic Touch","spotifyId":"3RgVfzLjDui6uzkLNci9wD"},{"title":"Rag Doll","spotifyId":"2KCJYwlBWxdlwyIYckIf6V"},{"title":"Simoriah","spotifyId":"1L1V1XIJJUhGCKXbQaIEkv"},{"title":"Dude (Looks Like A Lady)","spotifyId":"6gQUbFwwdYXlKdmqRoWKJe"},{"title":"St. John","spotifyId":"51vGtR4QF4E3cInSmiWXRc"},{"title":"Hangman Jury","spotifyId":"05eJthbLhxvnWvB3XF9HaQ"},{"title":"Girl Keeps Coming Apart","spotifyId":"4xgQw7ZW702iZpa2jIqRXP"},{"title":"Angel","spotifyId":"3kfXUGIdBNpyr2gBvU3Guj"},{"title":"Permanent Vacation","spotifyId":"0neVe9ZjvNk1ag0SrI2ra0"},{"title":"I'm Down","spotifyId":"3BD66eh4VaWHZsk2ho4IDs"},{"title":"The Movie","spotifyId":"0ykiJTuXdY3ExinGoMDEu9"}]},{"titulo":"Get a Grip","anio":"1993","spotifyUrl":"https://open.spotify.com/album/180jTzor4W2MQ9HW5h5Fh4","tidalUrl":"","appleMusicUrl":"","cover":"./covers/cover-180jTzor4W2MQ9HW5h5Fh4.jpg","tracks":[{"title":"Intro","spotifyId":"5L0NwntirpOO9MnjLb4tba"},{"title":"Eat The Rich","spotifyId":"3O7LU72UPGoCzrOFU6LqGd"},{"title":"Get A Grip","spotifyId":"0QDTTqEwu5IJ34wql1T03m"},{"title":"Fever","spotifyId":"42s962HgCuRSn6Ki8jry9D"},{"title":"Livin' On The Edge","spotifyId":"3Kv9uUVgt598jYAK79fPQb"},{"title":"Flesh","spotifyId":"3jsUYONfDGyL3XBTPoXzF8"},{"title":"Walk On Down","spotifyId":"6iOmvjaGoLLkSgwWxaqWCo"},{"title":"Shut Up And Dance","spotifyId":"0wXwgZtyTUumA9QlNQamcz"},{"title":"Cryin'","spotifyId":"4t1fWWJQs5V9YErfsrDslC"},{"title":"Gotta Love It","spotifyId":"6636i4UvDFekIBk6EfKJGU"},{"title":"Crazy","spotifyId":"3QxKpdTB8ZSFn8MGeCCpsQ"},{"title":"Line Up","spotifyId":"21N6Kaqbh7yhZdbjvnZ68s"},{"title":"Amazing","spotifyId":"60a5c4dDARPsksClcom0OD"},{"title":"Boogie Man","spotifyId":"1gRchGMOQESb5XvzIoTwB5"}]},{"titulo":"Nine Lives","anio":"1997","spotifyUrl":"https://open.spotify.com/album/0xUqFH2GDi0oZ7fwIBAkLQ","tidalUrl":"","appleMusicUrl":"","cover":"./covers/cover-0xUqFH2GDi0oZ7fwIBAkLQ.jpg","tracks":[{"title":"Nine Lives","spotifyId":"7l7xKcFmFRInQizauAJfyt"},{"title":"Falling In Love (Is Hard On The Knees)","spotifyId":"1oBTw7IkWnEUxiestsAD1V"},{"title":"Hole In My Soul","spotifyId":"7kPuCwBWgXy5TGfgwNUKwV"},{"title":"Taste of India","spotifyId":"2AeTI9yDFUI5lIjzfQMwnT"},{"title":"Full Circle","spotifyId":"3J36VgHD5KvlNR7NinNph5"},{"title":"Something's Gotta Give","spotifyId":"33eDPNcwsLHLkGbSZRGB9G"},{"title":"Ain't That A Bitch","spotifyId":"5BYs1MzSOtId1t2itGmHh2"},{"title":"The Farm","spotifyId":"3TuNmvSbj4HUJb1T7n19CJ"},{"title":"Crash","spotifyId":"6kbGxgORota3pbI1MpuHAH"},{"title":"Kiss Your Past Good-bye","spotifyId":"3JeTFJcQaBhYII0wuiz9xR"},{"title":"Pink","spotifyId":"74uGhWp4BYpjFj1V2DzgoO"},{"title":"Attitude Adjustment","spotifyId":"6kkaoDMV38mmVKB9DzvcVR"},{"title":"Fallen Angels","spotifyId":"3tbuVHyLKeHg3JsL7SfgJb"}]},{"titulo":"Just Push Play","anio":"2001","spotifyUrl":"https://open.spotify.com/album/6yRJAw8rbqn8dJVw1nxYWb","tidalUrl":"","appleMusicUrl":"","cover":"./covers/cover-6yRJAw8rbqn8dJVw1nxYWb.jpg","tracks":[{"title":"Beyond Beautiful","spotifyId":"2DVvFKCsDgjF5xrr6bBZ3I"},{"title":"Just Push Play","spotifyId":"3u1P7A1U6wlbm73j4NhDis"},{"title":"Jaded","spotifyId":"4iihDHIoKZdOeOW1kFDUtR"},{"title":"Fly Away From Here","spotifyId":"4QB2cdh2v5zeRD1khGF9A5"},{"title":"Trip Hoppin'","spotifyId":"1Red5oM4eXXT3ZNlUAh4GJ"},{"title":"Sunshine","spotifyId":"4tQnVmMQBfOPax9jZeiwvD"},{"title":"Under My Skin","spotifyId":"3jMBccRFHDkkU0jgNuRU1U"},{"title":"Luv Lies","spotifyId":"7roKO39vIifsIgwO1d3q4G"},{"title":"Outta Your Head","spotifyId":"4cipa2jQMepqpHDCcjdupv"},{"title":"Drop Dead Gorgeous","spotifyId":"1v06ZcheloVH3fQaze4nts"},{"title":"Light Inside","spotifyId":"4kEkY5m5c4fnsaPcN3E9id"},{"title":"Avant Garden","spotifyId":"7GiRfxnzCIGKdltC4ow2Ps"}]}];

  function esc(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function renderTrackRow(track, albumIndex, trackIndex){
    const num = String(trackIndex + 1).padStart(2, '0');
    const embedId = `track-embed-${albumIndex}-${trackIndex}`;
    return `<div class="track-row">
        <span class="track-num">${num}</span>
        <span class="track-title">${esc(track.title)}</span>
        <button class="track-play" data-spotify-id="${track.spotifyId}" data-embed="${embedId}">▶ Escuchar</button>
      </div>
      <div class="track-embed" id="${embedId}"></div>`;
  }

  function renderAlbum(a, i){
    const tracksHtml = Array.isArray(a.tracks) && a.tracks.length
      ? `<details class="tracklist">
          <summary>Ver los ${a.tracks.length} temas</summary>
          <div class="track-list">${a.tracks.map((t, j) => renderTrackRow(t, i, j)).join('')}</div>
        </details>`
      : '';
    const links = [
      a.spotifyUrl ? { url: a.spotifyUrl, label: 'Spotify' } : null,
      a.tidalUrl ? { url: a.tidalUrl, label: 'Tidal' } : null,
      a.appleMusicUrl ? { url: a.appleMusicUrl, label: 'Apple Music' } : null,
    ].filter(Boolean).map(l =>
      `<a class="album-link" href="${l.url}" target="_blank" rel="noopener">▶ ${l.label}</a>`
    ).join('');
    return `<div class="album">
        <div class="album-head">
          <div class="album-cover" style="${a.cover ? `background-image:url('${a.cover}')` : ''}"></div>
          <div class="album-info">
            <div class="album-title">${esc(a.titulo)}</div>
            <div class="album-year">${esc(a.anio)}</div>
            <div class="album-links">${links}</div>
          </div>
        </div>
        ${tracksHtml}
      </div>`;
  }

  const list = document.getElementById('list');
  list.innerHTML = ALBUMS.map((a, i) => renderAlbum(a, i)).join('');

  const MORE_ALBUMS = [];
  if(Array.isArray(MORE_ALBUMS) && MORE_ALBUMS.length){
    function renderMoreRow(a){
      const links = [
        a.spotifyUrl ? { url: a.spotifyUrl, label: 'Spotify' } : null,
        a.tidalUrl ? { url: a.tidalUrl, label: 'Tidal' } : null,
        a.appleMusicUrl ? { url: a.appleMusicUrl, label: 'Apple Music' } : null,
      ].filter(Boolean).map(l => `<a href="${l.url}" target="_blank" rel="noopener">${l.label}</a>`).join('');
      return `<div class="more-row">
          <span class="more-title">${esc(a.titulo)}<span class="more-year">${esc(a.anio)}</span></span>
          <span class="more-links">${links}</span>
        </div>`;
    }
    document.getElementById('moreAlbums').innerHTML = `
      <p class="more-label">Más discos</p>
      <div class="more-list">${MORE_ALBUMS.map(renderMoreRow).join('')}</div>`;
  }

  list.addEventListener('click', (e) => {
    const btn = e.target.closest('.track-play');
    if(!btn) return;
    const embed = document.getElementById(btn.dataset.embed);
    if(embed.classList.contains('open')){
      embed.classList.remove('open');
      embed.innerHTML = '';
      return;
    }
    document.querySelectorAll('.track-embed.open').forEach(el => { el.classList.remove('open'); el.innerHTML = ''; });
    embed.innerHTML = `<iframe src="https://open.spotify.com/embed/track/${btn.dataset.spotifyId}?utm_source=generator" height="152" allow="encrypted-media" loading="lazy"></iframe>`;
    embed.classList.add('open');
  });
</script>
</body>
</html>
