<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Whitney Houston</title>
<meta name="description" content="&quot;Escaneá. Escuchá. Repetí.&quot; — ScanBeat">
<meta property="og:site_name" content="ScanBeat">
<meta property="og:title" content="Whitney Houston">
<meta property="og:description" content="&quot;Escaneá. Escuchá. Repetí.&quot; — ScanBeat">
<meta property="og:image" content="https://scanbeat.com.ar/cards/whitney-houston-discografia/covers/cover-5Vdzprr5cOqXQo44eHeV7t.jpg">
<meta property="og:url" content="https://scanbeat.com.ar/cards/whitney-houston-discografia/">
<meta property="og:type" content="website">
<meta name="theme-color" content="#5c0011">
<style>
  :root{
    --bg1:#1a1a2e; --bg2:#16213e; --accent:#e94560; --accent2:#ffd166; --text:#ffffff;
  }
  html[data-theme="cumpleanos"]{ --bg1:#3a0d5c; --bg2:#7b2d8e; --accent:#ff6fb5; --accent2:#ffd166; }
  html[data-theme="fiesta"]{ --bg1:#0f0c29; --bg2:#302b63; --accent:#00f5d4; --accent2:#f15bb5; }
  html[data-theme="evento"]{ --bg1:#0b0b0b; --bg2:#1c1c1c; --accent:#d4af37; --accent2:#ffffff; }
  html[data-theme="regalo"]{ --bg1:#5c0011; --bg2:#8e0e3a; --accent:#ff8fa3; --accent2:#ffd166; }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; min-height:100%; width:100%;
    background:radial-gradient(circle at 50% 0%, var(--bg2), var(--bg1));
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text);
  }
  header{ text-align:center; padding:48px 20px 12px; }
  h1{
    margin:0; font-size:clamp(24px,6vw,36px); font-weight:800;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    line-height:1.2;
  }
  .subtitle{ margin:8px 0 0; font-size:13px; opacity:.6; text-transform:uppercase; letter-spacing:.1em; }
  .intro{
    max-width:520px; margin:20px auto 0; font-size:clamp(13px,3.4vw,15px); line-height:1.9;
    font-family:Georgia,'Times New Roman',serif; letter-spacing:.04em; font-weight:400; opacity:.88;
  }
  .yt-link{
    display:inline-flex; align-items:center; gap:6px; margin-top:14px; text-decoration:none;
    color:var(--text); background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.22);
    padding:8px 16px; border-radius:20px; font-size:13px; font-weight:600;
  }
  .yt-link small{ font-size:10px; font-weight:400; opacity:.65; text-transform:uppercase; }

  .list{ max-width:560px; margin:0 auto; padding:24px 16px 60px; display:flex; flex-direction:column; gap:14px; }

  .album{
    background:rgba(255,255,255,.05); border-radius:16px; padding:14px;
  }
  .album-head{ display:flex; gap:14px; align-items:center; }
  .album-cover{
    width:76px; height:76px; flex-shrink:0; border-radius:10px; background-color:var(--accent);
    background-size:cover; background-position:center top; box-shadow:0 8px 20px rgba(0,0,0,.4);
  }
  .album-info{ flex:1; min-width:0; }
  .album-title{ font-size:15px; font-weight:700; line-height:1.3; }
  .album-year{ font-size:12px; opacity:.55; margin-top:2px; }
  .album-links{ display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .album-link{
    display:inline-flex; align-items:center; gap:6px;
    font-size:13px; font-weight:700; color:var(--text); text-decoration:none;
    background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.25);
    padding:8px 14px; border-radius:20px;
  }

  details.tracklist{
    margin-top:12px; background:rgba(255,255,255,.06); border-radius:14px; padding:4px 14px;
  }
  details.tracklist summary{
    cursor:pointer; padding:12px 0; font-weight:700; font-size:14px; list-style:none;
  }
  .track-list{ margin:0 0 12px; text-align:left; }
  .track-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 0; border-bottom:1px solid rgba(255,255,255,.08);
  }
  .track-row:last-child{ border-bottom:none; }
  .track-num{ opacity:.5; font-size:11px; width:18px; flex-shrink:0; }
  .track-title{ font-size:13px; opacity:.9; flex:1; }
  .track-play{
    flex-shrink:0; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.22);
    color:var(--text); border-radius:20px; padding:4px 10px; font-size:11px; cursor:pointer;
  }
  .track-embed{ display:none; padding:6px 0 10px 18px; }
  .track-embed.open{ display:block; }
  .track-embed iframe{ width:100%; border-radius:10px; border:none; }

  .more-albums{ max-width:560px; margin:0 auto; padding:0 16px 8px; }
  .more-albums .more-label{
    margin:4px 0 12px; font-size:12px; opacity:.55; text-transform:uppercase; letter-spacing:.08em;
    text-align:center;
  }
  .more-list{ display:flex; flex-direction:column; gap:2px; }
  .more-row{
    display:flex; align-items:baseline; justify-content:space-between; gap:10px;
    padding:10px 4px; border-bottom:1px solid rgba(255,255,255,.08);
  }
  .more-row:last-child{ border-bottom:none; }
  .more-title{ font-size:13px; font-weight:600; opacity:.9; }
  .more-year{ font-size:11px; opacity:.5; margin-left:6px; }
  .more-links{ display:flex; gap:10px; flex-shrink:0; }
  .more-links a{ font-size:12px; font-weight:700; color:var(--accent2); text-decoration:none; }

  .brand-footer{ text-align:center; padding:4px 20px 48px; opacity:.75; }
  .brand-footer .domain{ color:var(--text); text-decoration:none; font-size:13px; font-weight:700; }
  .brand-footer .slogan{ margin:6px 0 0; font-size:12px; font-style:italic; opacity:.8; }
</style>
</head>
<body>
<header>
  <h1>Whitney Houston</h1>
  <p class="subtitle">Discografía</p>
  <p class="intro"></p>
  <div id="ytLinkWrap"></div>
</header>

<div class="list" id="list"></div>

<div class="more-albums" id="moreAlbums"></div>

<footer class="brand-footer">
  <a class="domain" href="https://scanbeat.com.ar" target="_blank" rel="noopener">🌐 scanbeat.com.ar</a>
  <p class="slogan">"Escaneá. Escuchá. Repetí."</p>
</footer>

<script>
  document.documentElement.setAttribute('data-theme', "regalo");

  const YOUTUBE_URL = "https://www.youtube.com/channel/UC7fzrpTArAqDHuB3Hbmd_CQ";
  if(YOUTUBE_URL){
    document.getElementById('ytLinkWrap').innerHTML =
      `<a class="yt-link" href="${YOUTUBE_URL}" target="_blank" rel="noopener">▶ Canal oficial de YouTube<small>sin cuenta</small></a>`;
  }

  const ALBUMS = [{"titulo":"Whitney Houston","anio":"1985","spotifyUrl":"https://open.spotify.com/album/5Vdzprr5cOqXQo44eHeV7t","tidalUrl":"","appleMusicUrl":"","cover":"./covers/cover-5Vdzprr5cOqXQo44eHeV7t.jpg","tracks":[{"title":"I Wanna Dance with Somebody (Who Loves Me)","spotifyId":"2tUBqZG2AbRi7Q0BIrVrEj"},{"title":"Just the Lonely Talking Again","spotifyId":"03I2WC8v4crMRBcjwyzmOy"},{"title":"Love Will Save the Day","spotifyId":"4gDBc1RxPAvinJrZzZ9nYX"},{"title":"Didn't We Almost Have It All","spotifyId":"19wadMw1A8XejDV4p5wMt1"},{"title":"So Emotional","spotifyId":"4l2Edgdj4vla02GCh7YyAv"},{"title":"Where You Are","spotifyId":"4vcCPWXgVk8B4xdgshk6cI"},{"title":"Love Is a Contact Sport","spotifyId":"3mSoszSicci7wGb0lDKftK"},{"title":"You're Still My Man","spotifyId":"2csRQWI7A2FjLYBQBiAIoi"},{"title":"For the Love of You","spotifyId":"2MJQbnpAPKR83FFk19Bq3p"},{"title":"Where Do Broken Hearts Go","spotifyId":"7tLtIZclwLWk54PFAyDv5T"},{"title":"I Know Him So Well - from \"Chess\"","spotifyId":"0s5foteQsQsBskBZMrExLO"}]},{"titulo":"Whitney","anio":"1987","spotifyUrl":"https://open.spotify.com/album/5KuwvwzQkwgPWiVY6B84ve","tidalUrl":"","appleMusicUrl":"","cover":"./covers/cover-5KuwvwzQkwgPWiVY6B84ve.jpg","tracks":[{"title":"I Wanna Dance with Somebody (Who Loves Me)","spotifyId":"6b057owAeKjs4FPlfSraF2"},{"title":"Just the Lonely Talking Again","spotifyId":"09PuIMLjJCgqM7TJMI50WH"},{"title":"Love Will Save the Day","spotifyId":"7GqhXd37l8jY7sgYr7VX37"},{"title":"Didn't We Almost Have It All","spotifyId":"4yt78b96ekTSYVzcfDLIlV"},{"title":"So Emotional","spotifyId":"6hWh5M4WGqXgVbOt5yA7d5"},{"title":"Where You Are","spotifyId":"3FcqiD86SWIzIujy6WfadO"},{"title":"Love Is a Contact Sport","spotifyId":"2DsJmcLh18iWZ7MvCwRLIL"},{"title":"You're Still My Man","spotifyId":"5Qgy2oADekKH93hfA27h6N"},{"title":"For the Love of You","spotifyId":"04ud7EkOxG0aaWMU9g1Ke2"},{"title":"Where Do Broken Hearts Go","spotifyId":"5AZUzYkYbe1P1bq9VBttsc"},{"title":"I Know Him So Well","spotifyId":"0FUMKMEwZhWdBaMWYLGGcS"}]},{"titulo":"I'm Your Baby Tonight","anio":"1990","spotifyUrl":"https://open.spotify.com/album/5LaUUDnUTySWnJLj1xiBnw","tidalUrl":"","appleMusicUrl":"","cover":"./covers/cover-5LaUUDnUTySWnJLj1xiBnw.jpg","tracks":[{"title":"I'm Your Baby Tonight","spotifyId":"3SmPl0CGxvvkQCrTv7edEE"},{"title":"My Name Is Not Susan","spotifyId":"7623p8KZ24WTeO0NeIb4tV"},{"title":"All The Man That I Need","spotifyId":"07M76e7IXxYdnC1BBiJxEX"},{"title":"Lover for Life","spotifyId":"2tYPx6gPuRDKOmoBZOGfNJ"},{"title":"Anymore","spotifyId":"4bDVcRtHvVXiCdhwbq7Tpk"},{"title":"Miracle","spotifyId":"6LuRPg5tHDwcyXvEvrtVxP"},{"title":"I Belong To You","spotifyId":"1v432WiNGnjfsdDAjMJrxQ"},{"title":"Who Do You Love","spotifyId":"2dUFDcYgiXgDO7ohd52kRr"},{"title":"We Didn't Know (with Stevie Wonder)","spotifyId":"6fFVwBQbgOsLgL7Mj7vJoN"},{"title":"After We Make Love","spotifyId":"6K72MqCTSQTb1I6spurCTB"},{"title":"I'm Knockin'","spotifyId":"2mZKMwamr50x6vrcjVa4bK"}]},{"titulo":"My Love Is Your Love","anio":"1998","spotifyUrl":"https://open.spotify.com/album/00NABajpGsPCObfcl4LJsM","tidalUrl":"","appleMusicUrl":"","cover":"./covers/cover-00NABajpGsPCObfcl4LJsM.jpg","tracks":[{"title":"It's Not Right But It's Okay","spotifyId":"7861kBrZ5aw7o4NfggcyYW"},{"title":"Heartbreak Hotel (feat. Faith Evans & Kelly Price)","spotifyId":"4J9u7UsXH7F6sFI32KnYuP"},{"title":"My Love Is Your Love","spotifyId":"1ckU1EhAO0Nr73QYw24SWJ"},{"title":"When You Believe - from The Prince of Egypt","spotifyId":"0JN7vUgUolHGHFrOR8xk7S"},{"title":"If I Told You That","spotifyId":"6Hk49EZCW2HGJx20LWaQPF"},{"title":"In My Business (feat. Missy \"Misdemeanor\" Elliott)","spotifyId":"2V7hSVI9YwkKvVUhXY2CbT"},{"title":"I Learned from the Best","spotifyId":"3wACjmQo7ZkRNMLfZXndFB"},{"title":"Oh Yes","spotifyId":"1U2nYDhFlikoMa1UBp2qtK"},{"title":"Get It Back","spotifyId":"3U7PLjhBYzuEH0r5XmNtuI"},{"title":"Until You Come Back","spotifyId":"2uJlJ0F7YIU9740Ggy6JdL"},{"title":"I Bow Out","spotifyId":"2VgaALs0kKa9EG76A7T7uB"},{"title":"You'll Never Stand Alone","spotifyId":"3KFbjIFQxMbOKdZ4S3lv4S"},{"title":"I Was Made To Love Him","spotifyId":"2nJzMBYSpfg9Y5U88ANDeK"}]},{"titulo":"Just Whitney","anio":"2002","spotifyUrl":"https://open.spotify.com/album/2OKGzc3fuICq5CJzBjjGWy","tidalUrl":"","appleMusicUrl":"","cover":"./covers/cover-2OKGzc3fuICq5CJzBjjGWy.jpg","tracks":[{"title":"Whatchulookinat - Main (A.K.A. Backing Vox Up)","spotifyId":"5dpKWLHPVtpVuWTtI5KDHl"},{"title":"Tell Me No","spotifyId":"2vkiZZlHKS8vr7Mrw2J55k"},{"title":"One Of Those Days","spotifyId":"5KvNe04JqMS8YCP912VsLT"},{"title":"Things You Say","spotifyId":"0t8iP1BCUQuGs6BgPn0zwg"},{"title":"My Love","spotifyId":"1iJRlHgK9RhAXxVFSfgikI"},{"title":"Love That Man","spotifyId":"667HNd7i010d4M8PKpywx0"},{"title":"Try It On My Own","spotifyId":"1Dbu9wueLsbgXUctjlRo8I"},{"title":"Dear John Letter","spotifyId":"77dSctq0a9qqTrYQqul9tx"},{"title":"Unashamed","spotifyId":"1GQdNdJL4pQEiB5VuGS2gM"},{"title":"You Light Up My Life","spotifyId":"4PZMZqo8YpsIPrPYpc7CoM"},{"title":"Whatchulookinat - P. Diddy Remix - Radio Edit","spotifyId":"77IwEUHMW8rb9rcsZpvndh"}]},{"titulo":"I Look to You","anio":"2009","spotifyUrl":"https://open.spotify.com/album/3VPDCqgJfdq1GEqitheCtn","tidalUrl":"","appleMusicUrl":"","cover":"./covers/cover-3VPDCqgJfdq1GEqitheCtn.jpg","tracks":[{"title":"Million Dollar Bill","spotifyId":"5w4Hocwc7JXeJhtoMPJtTZ"},{"title":"Nothin' But Love","spotifyId":"1XFtaA49X4Q6xYAlC9LGTL"},{"title":"Call You Tonight","spotifyId":"5Laqq7kRySpn9vhkZczjNk"},{"title":"I Look to You","spotifyId":"2ySDKHsjXDrvEOtgEW2YWg"},{"title":"Like I Never Left (feat. Akon)","spotifyId":"51no4AjXfV79rpEjqzZBAe"},{"title":"A Song For You","spotifyId":"7AwU1wxdM4XBMUIuQI4Arb"},{"title":"I Didn't Know My Own Strength","spotifyId":"3wF9ChtgbfWhkS7m2HDy9d"},{"title":"Worth It","spotifyId":"5kUaynjSOwuzUyn9wiBNvG"},{"title":"For The Lovers","spotifyId":"4cUauqPP7hLPnTDDJ7pB6O"},{"title":"I Got You","spotifyId":"4MkUJZWnjxDg9JgA1Kdp87"},{"title":"Salute","spotifyId":"0tlfXooBX4p8Qv8ED6GT6Y"}]}];

  function esc(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function renderTrackRow(track, albumIndex, trackIndex){
    const num = String(trackIndex + 1).padStart(2, '0');
    const embedId = `track-embed-${albumIndex}-${trackIndex}`;
    return `<div class="track-row">
        <span class="track-num">${num}</span>
        <span class="track-title">${esc(track.title)}</span>
        <button class="track-play" data-spotify-id="${track.spotifyId}" data-embed="${embedId}">▶ Escuchar</button>
      </div>
      <div class="track-embed" id="${embedId}"></div>`;
  }

  function renderAlbum(a, i){
    const tracksHtml = Array.isArray(a.tracks) && a.tracks.length
      ? `<details class="tracklist">
          <summary>Ver los ${a.tracks.length} temas</summary>
          <div class="track-list">${a.tracks.map((t, j) => renderTrackRow(t, i, j)).join('')}</div>
        </details>`
      : '';
    const links = [
      a.spotifyUrl ? { url: a.spotifyUrl, label: 'Spotify' } : null,
      a.tidalUrl ? { url: a.tidalUrl, label: 'Tidal' } : null,
      a.appleMusicUrl ? { url: a.appleMusicUrl, label: 'Apple Music' } : null,
    ].filter(Boolean).map(l =>
      `<a class="album-link" href="${l.url}" target="_blank" rel="noopener">▶ ${l.label}</a>`
    ).join('');
    return `<div class="album">
        <div class="album-head">
          <div class="album-cover" style="${a.cover ? `background-image:url('${a.cover}')` : ''}"></div>
          <div class="album-info">
            <div class="album-title">${esc(a.titulo)}</div>
            <div class="album-year">${esc(a.anio)}</div>
            <div class="album-links">${links}</div>
          </div>
        </div>
        ${tracksHtml}
      </div>`;
  }

  const list = document.getElementById('list');
  list.innerHTML = ALBUMS.map((a, i) => renderAlbum(a, i)).join('');

  const MORE_ALBUMS = [];
  if(Array.isArray(MORE_ALBUMS) && MORE_ALBUMS.length){
    function renderMoreRow(a){
      const links = [
        a.spotifyUrl ? { url: a.spotifyUrl, label: 'Spotify' } : null,
        a.tidalUrl ? { url: a.tidalUrl, label: 'Tidal' } : null,
        a.appleMusicUrl ? { url: a.appleMusicUrl, label: 'Apple Music' } : null,
      ].filter(Boolean).map(l => `<a href="${l.url}" target="_blank" rel="noopener">${l.label}</a>`).join('');
      return `<div class="more-row">
          <span class="more-title">${esc(a.titulo)}<span class="more-year">${esc(a.anio)}</span></span>
          <span class="more-links">${links}</span>
        </div>`;
    }
    document.getElementById('moreAlbums').innerHTML = `
      <p class="more-label">Más discos</p>
      <div class="more-list">${MORE_ALBUMS.map(renderMoreRow).join('')}</div>`;
  }

  list.addEventListener('click', (e) => {
    const btn = e.target.closest('.track-play');
    if(!btn) return;
    const embed = document.getElementById(btn.dataset.embed);
    if(embed.classList.contains('open')){
      embed.classList.remove('open');
      embed.innerHTML = '';
      return;
    }
    document.querySelectorAll('.track-embed.open').forEach(el => { el.classList.remove('open'); el.innerHTML = ''; });
    embed.innerHTML = `<iframe src="https://open.spotify.com/embed/track/${btn.dataset.spotifyId}?utm_source=generator" height="152" allow="encrypted-media" loading="lazy"></iframe>`;
    embed.classList.add('open');
  });
</script>
</body>
</html>
