<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thriller 40</title>
<style>
  :root{
    --bg1:#1a1a2e; --bg2:#16213e; --accent:#e94560; --accent2:#ffd166; --text:#ffffff;
  }
  html[data-theme="cumpleanos"]{ --bg1:#3a0d5c; --bg2:#7b2d8e; --accent:#ff6fb5; --accent2:#ffd166; }
  html[data-theme="fiesta"]{ --bg1:#0f0c29; --bg2:#302b63; --accent:#00f5d4; --accent2:#f15bb5; }
  html[data-theme="evento"]{ --bg1:#0b0b0b; --bg2:#1c1c1c; --accent:#d4af37; --accent2:#ffffff; }
  html[data-theme="regalo"]{ --bg1:#5c0011; --bg2:#8e0e3a; --accent:#ff8fa3; --accent2:#ffd166; }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; min-height:100%; width:100%;
    background:radial-gradient(circle at 50% 0%, var(--bg2), var(--bg1));
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text);
  }
  .hero{
    min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    padding:24px; gap:16px; position:relative;
  }
  h1{
    margin:0; font-size:clamp(22px,6vw,34px); font-weight:800;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    line-height:1.2; max-width:90vw;
  }
  .message{
    margin:0; max-width:520px; font-size:clamp(15px,4vw,18px); line-height:1.5; opacity:.92;
    white-space:pre-wrap;
  }

  .cover-hero{
    position:relative; width:min(320px,82vw); aspect-ratio:1; flex-shrink:0;
    border-radius:22px; background-color:var(--accent);
    background-size:cover; background-position:center;
    box-shadow:0 25px 60px rgba(0,0,0,.55);
    display:flex; align-items:center; justify-content:center;
    transition:box-shadow .4s ease;
  }
  .cover-fallback{ font-size:64px; opacity:.85; }
  .cover-hero::after{
    content:''; position:absolute; inset:-10px; border-radius:28px;
    border:2px solid rgba(255,255,255,.35); opacity:0;
  }
  .cover-hero.playing::after{ animation: ripple 1.8s ease-out infinite; }
  @keyframes ripple{
    0%{ opacity:.55; inset:-10px; }
    100%{ opacity:0; inset:-24px; }
  }

  .now-playing{ display:flex; align-items:flex-end; gap:4px; height:20px; opacity:0; transition:opacity .3s ease; }
  .now-playing.playing{ opacity:.9; }
  .now-playing span{
    width:4px; background:linear-gradient(180deg,var(--accent2),var(--accent));
    border-radius:2px; animation: bar 900ms ease-in-out infinite; animation-play-state:paused;
  }
  .now-playing.playing span{ animation-play-state:running; }
  .now-playing span:nth-child(1){ height:40%; animation-delay:0ms; }
  .now-playing span:nth-child(2){ height:100%; animation-delay:120ms; }
  .now-playing span:nth-child(3){ height:60%; animation-delay:240ms; }
  .now-playing span:nth-child(4){ height:85%; animation-delay:360ms; }
  .now-playing span:nth-child(5){ height:50%; animation-delay:480ms; }
  @keyframes bar{ 0%,100%{ transform:scaleY(.4);} 50%{ transform:scaleY(1);} }

  .tap-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.55); backdrop-filter:blur(2px);
    display:flex; align-items:center; justify-content:center; z-index:20;
    animation: pulse-bg 2s ease-in-out infinite;
  }
  .tap-btn{
    display:flex; flex-direction:column; align-items:center; gap:10px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#111; font-weight:800; font-size:18px; border:none;
    padding:22px 34px; border-radius:20px; cursor:pointer;
    box-shadow:0 10px 30px rgba(0,0,0,.4); animation: pop 1.4s ease-in-out infinite;
  }
  .tap-btn .icon{ font-size:34px; }
  @keyframes pop{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.06);} }
  @keyframes pulse-bg{ 0%,100%{ background:rgba(0,0,0,.55);} 50%{ background:rgba(0,0,0,.7);} }

  .mini-controls{
    position:fixed; bottom:18px; left:0; right:0; display:flex; justify-content:center; gap:16px; z-index:5;
  }
  .mini-controls button{
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25); color:var(--text);
    width:42px; height:42px; border-radius:50%; font-size:16px; cursor:pointer;
  }
  .hidden{ display:none !important; }
  .scroll-hint{ position:absolute; bottom:18px; font-size:13px; opacity:.6; animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(6px);} }

  .album-section{
    max-width:560px; margin:0 auto; padding:32px 20px 60px; display:flex;
    flex-direction:column; align-items:center; gap:18px; text-align:center;
  }
  .cover{
    width:min(260px,70vw); border-radius:16px; box-shadow:0 12px 40px rgba(0,0,0,.5);
  }
  .album-name{ margin:0; font-size:18px; font-weight:700; opacity:.95; }
  .album-credit{ margin:0; font-size:12px; opacity:.6; }

  .links-label{ margin:4px 0 -4px; font-size:12px; opacity:.6; text-transform:uppercase; letter-spacing:.06em; }
  .platform-links{ display:flex; flex-wrap:wrap; justify-content:center; gap:10px; width:100%; }
  .platform-links a{
    display:flex; align-items:center; gap:8px; text-decoration:none; color:var(--text);
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18);
    padding:10px 16px; border-radius:12px; font-size:14px; font-weight:600;
  }

  details.tracklist{
    width:100%; background:rgba(255,255,255,.06); border-radius:14px; padding:4px 16px;
  }
  details.tracklist summary{
    cursor:pointer; padding:14px 0; font-weight:700; font-size:15px; list-style:none;
  }
  .track-list{ margin:0 0 14px; text-align:left; }
  .track-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:9px 0; border-bottom:1px solid rgba(255,255,255,.08);
  }
  .track-row:last-child{ border-bottom:none; }
  .track-num{ opacity:.5; font-size:12px; width:20px; flex-shrink:0; }
  .track-title{ font-size:14px; opacity:.9; flex:1; }
  .track-play{
    flex-shrink:0; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.22);
    color:var(--text); border-radius:20px; padding:5px 12px; font-size:12px; cursor:pointer;
  }
  .track-embed{ display:none; padding:6px 0 12px 20px; }
  .track-embed.open{ display:block; }
  .track-embed iframe{ width:100%; border-radius:10px; border:none; }
</style>
</head>
<body>
<section class="hero">
  <h1>Thriller 40</h1>
  <div class="cover-hero" id="player">
    <div class="cover-fallback" id="coverFallback">🎵</div>
  </div>
  
  <div class="now-playing" id="nowPlaying">
    <span></span><span></span><span></span><span></span><span></span>
  </div>
  
  <p class="message"></p>
  <div class="scroll-hint" id="scrollHint">⌄ deslizá para ver el disco</div>
</section>

<section class="album-section" id="albumSection"></section>


<div class="tap-overlay" id="tapOverlay">
  <button class="tap-btn" id="tapBtn">
    <span class="icon">🎵</span>
    Toca para escuchar
  </button>
</div>

<div class="mini-controls hidden" id="miniControls">
  <button id="toggleBtn">⏸</button>
</div>

<audio id="audio" src="./song.wav" preload="auto" loop playsinline></audio>


<script>
  document.documentElement.setAttribute('data-theme', "regalo");

  // Datos opcionales del disco (si una tarjeta no los usa, quedan vacíos y esa sección no se muestra)
  const ALBUM = {
    name: "Thriller 40",
    artist: "Michael Jackson",
    cover: "./cover.jpg",
    spotifyUrl: "https://open.spotify.com/album/57TzZhbqvYoUBzJSVKFVlG",
    tidalUrl: "https://tidal.com/album/260578202",
    appleMusicUrl: "https://music.apple.com/us/album/thriller-40/1641780996",
    tracklist: [{"title":"Wanna Be Startin' Somethin'","spotifyId":"2rTP0iwaMxRy2HFW2nHKq9"},{"title":"Baby Be Mine","spotifyId":"0z0HC6sLfJsTP5bqVPiIw6"},{"title":"The Girl Is Mine (with Paul McCartney)","spotifyId":"46bcHfciO740CEABQrvLrR"},{"title":"Thriller","spotifyId":"2x4x2j4mrdFMuSQnIJDVWM"},{"title":"Beat It","spotifyId":"2x0O1Lg3lhpUqw30Hamzke"},{"title":"Billie Jean","spotifyId":"0MHgys5H8i0bvpIScMeNTl"},{"title":"Human Nature","spotifyId":"6JyGRAFxCTEbSvhrLb206x"},{"title":"P.Y.T. (Pretty Young Thing)","spotifyId":"1URAAak0dRPksAeugKMpEu"},{"title":"The Lady in My Life","spotifyId":"0R7rnPjNqlYwK2b5LNX0aO"},{"title":"Starlight","spotifyId":"4WGwTL5HIiaw5OIFnwgCR9"},{"title":"Got the Hots - Demo","spotifyId":"21fVbhoPzmlLjxWfePb6CT"},{"title":"Who Do You Know - Demo","spotifyId":"5kMng2A15zTwpxiPHypbHm"},{"title":"Carousel","spotifyId":"39SzRa9nN9SFWPnbcMgrYX"},{"title":"Behind The Mask - Mike's Mix (Demo)","spotifyId":"32gg7lWCipR6jYiz9qXwSo"},{"title":"Can't Get Outta The Rain","spotifyId":"5yuLvy5xOhnhMZL0SjIZcX"},{"title":"The Toy - Demo","spotifyId":"2KmJ8VLU4MoX0BoCoo2LSw"},{"title":"Sunset Driver - Demo","spotifyId":"4vA0xg2ObT0RlUwZMDy5kZ"},{"title":"What A Lovely Way To Go - Demo","spotifyId":"4INbMHPtay1Q8fU9090FCc"},{"title":"She's Trouble - Demo","spotifyId":"1FXtdKmCuA38ClAUHI3YjZ"},{"title":"Billie Jean (1981 Home Demo)","spotifyId":"70WBe8dtmzg0OBrrJtN28n"},{"title":"Billie Jean - Long Version","spotifyId":"1euuAfFtkRzJy489azxfLC"},{"title":"Billie Jean (2008 Kanye West Mix) (feat. Kanye West) - Thriller 25th Anniversary Remix","spotifyId":"4jeLWjIvoZ2uWJrkrFo3xA"},{"title":"Beat It - Demo","spotifyId":"7MwHvUIsJCd8vsAhMqyGa5"},{"title":"Beat It (2008 with Fergie Remix) (with Fergie) - Thriller 25th Anniversary Remix","spotifyId":"6XgiJfqS5LdiptYHksfmSI"},{"title":"Wanna Be Startin' Somethin' - Demo","spotifyId":"2GQIHRlbPNnZKvJUeB468J"},{"title":"Wanna Be Startin' Somethin' - Tommy D's Main Mix","spotifyId":"0knaQtcr1cKpE4VlE9mTTa"},{"title":"Wanna Be Startin' Somethin' (2008 with Akon) (with Akon) - Thriller 25th Anniversary Remix","spotifyId":"2ievGqNfnUSaEBPrMQDTxB"},{"title":"Human Nature 7\"","spotifyId":"0E1aGd78m6l0qPwrjTjSpn"},{"title":"P.Y.T. (Pretty Young Thing) - Demo Version","spotifyId":"7FFTcmagmrEDNOe530kvhl"},{"title":"P.Y.T. (Pretty Young Thing) (2008 with will.i.am) (with will.i.am) - Thriller 25th Anniversary Remix","spotifyId":"3FCOOd1ShN8qpHNcMoSPIb"},{"title":"The Girl Is Mine (2008 with will.i.am) (with will.i.am) - Thriller 25th Anniversary Remix","spotifyId":"2jsOxLbTofSAPeLhNR9ll5"},{"title":"Thriller 7\" - Special Edit","spotifyId":"3VKj7hHHi8pJJ4mHDzZC4Q"},{"title":"Thriller - Def Thrill Mix","spotifyId":"5dELg4e472LaS76hzPOvi6"},{"title":"Thriller (Megamix)","spotifyId":"2I5o2Znqz37AibPdyg824v"}]
  };

  const audio = document.getElementById('audio');
  const overlay = document.getElementById('tapOverlay');
  const tapBtn = document.getElementById('tapBtn');
  const player = document.getElementById('player');
  const coverFallback = document.getElementById('coverFallback');
  const nowPlaying = document.getElementById('nowPlaying');
  const miniControls = document.getElementById('miniControls');
  const toggleBtn = document.getElementById('toggleBtn');
  const scrollHint = document.getElementById('scrollHint');

  if(audio){
    function onPlaying(){
      overlay.classList.add('hidden');
      miniControls.classList.remove('hidden');
      player.classList.add('playing');
      nowPlaying.classList.add('playing');
      toggleBtn.textContent = '⏸';
    }
    function onPaused(){
      player.classList.remove('playing');
      nowPlaying.classList.remove('playing');
      toggleBtn.textContent = '▶';
    }

    audio.addEventListener('playing', onPlaying);
    audio.addEventListener('pause', onPaused);

    // Intenta autoplay apenas carga (funciona seguido si se llegó por un tap/click real, como al escanear QR o leer NFC)
    audio.play().then(() => {
      overlay.classList.add('hidden');
    }).catch(() => {
      overlay.classList.remove('hidden');
    });

    tapBtn.addEventListener('click', () => {
      audio.play().catch(()=>{});
    });

    toggleBtn.addEventListener('click', () => {
      if(audio.paused){ audio.play().catch(()=>{}); } else { audio.pause(); }
    });
  }

  function esc(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function renderAlbumSection(){
    const hasAlbum = ALBUM.name || ALBUM.cover || ALBUM.spotifyUrl || ALBUM.tidalUrl || ALBUM.appleMusicUrl;
    if(!hasAlbum){ scrollHint.classList.add('hidden'); return; }

    if(ALBUM.cover){
      player.style.backgroundImage = `url("${ALBUM.cover}")`;
      coverFallback.classList.add('hidden');
    }

    const el = document.getElementById('albumSection');
    let html = '';
    if(ALBUM.cover) html += `<img class="cover" src="${ALBUM.cover}" alt="Portada">`;
    if(ALBUM.name) html += `<p class="album-name">${esc(ALBUM.name)}</p>`;
    if(ALBUM.artist) html += `<p class="album-credit">${esc(ALBUM.artist)}</p>`;

    const links = [];
    if(ALBUM.spotifyUrl) links.push(['Spotify', ALBUM.spotifyUrl]);
    if(ALBUM.tidalUrl) links.push(['Tidal', ALBUM.tidalUrl]);
    if(ALBUM.appleMusicUrl) links.push(['Apple Music', ALBUM.appleMusicUrl]);
    if(links.length){
      html += '<p class="links-label">Escuchar el disco completo en:</p>' +
        '<div class="platform-links">' +
        links.map(([label,url]) => `<a href="${url}" target="_blank" rel="noopener">▶ ${label}</a>`).join('') +
        '</div>';
    }

    if(Array.isArray(ALBUM.tracklist) && ALBUM.tracklist.length){
      html += `<details class="tracklist">
        <summary>Ver los ${ALBUM.tracklist.length} temas del disco</summary>
        <div class="track-list">${ALBUM.tracklist.map((t, i) => renderTrackRow(t, i)).join('')}</div>
      </details>`;
    }

    el.innerHTML = html;
    el.addEventListener('click', onTrackPlayClick);
  }

  function renderTrackRow(track, i){
    const title = typeof track === 'string' ? track : track.title;
    const spotifyId = typeof track === 'string' ? null : track.spotifyId;
    const num = String(i + 1).padStart(2, '0');
    const playBtn = spotifyId
      ? `<button class="track-play" data-spotify-id="${spotifyId}" data-embed="track-embed-${i}">▶ Escuchar</button>`
      : '';
    return `<div class="track-row">
        <span class="track-num">${num}</span>
        <span class="track-title">${esc(title)}</span>
        ${playBtn}
      </div>
      ${spotifyId ? `<div class="track-embed" id="track-embed-${i}"></div>` : ''}`;
  }

  function onTrackPlayClick(e){
    const btn = e.target.closest('.track-play');
    if(!btn) return;
    const embed = document.getElementById(btn.dataset.embed);
    if(embed.classList.contains('open')){
      embed.classList.remove('open');
      embed.innerHTML = '';
      return;
    }
    document.querySelectorAll('.track-embed.open').forEach(el => { el.classList.remove('open'); el.innerHTML = ''; });
    embed.innerHTML = `<iframe src="https://open.spotify.com/embed/track/${btn.dataset.spotifyId}?utm_source=generator" height="152" allow="encrypted-media" loading="lazy"></iframe>`;
    embed.classList.add('open');
  }
</script>
</body>
</html>
