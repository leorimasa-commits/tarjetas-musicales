  function esc(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function renderTrackRow(track, albumIndex, trackIndex){
    const num = String(trackIndex + 1).padStart(2, '0');
    const embedId = `track-embed-${albumIndex}-${trackIndex}`;
    return `<div class="track-row">
        <span class="track-num">${num}</span>
        <span class="track-title">${esc(track.title)}</span>
        <button class="track-play" data-spotify-id="${track.spotifyId}" data-embed="${embedId}">▶ Escuchar</button>
      </div>
      <div class="track-embed" id="${embedId}"></div>`;
  }

  function renderAlbum(a, i){

      ? `<details class="tracklist">
          <summary>Ver los ${a.tracks.length} temas</summary>
          <div class="track-list">${a.tracks.map((t, j) => renderTrackRow(t, i, j)).join('')}</div>
        </details>`
      : '';
    const links = [
      a.spotifyUrl ? { url: a.spotifyUrl, label: 'Spotify' } : null,
      a.tidalUrl ? { url: a.tidalUrl, label: 'Tidal' } : null,
      a.appleMusicUrl ? { url: a.appleMusicUrl, label: 'Apple Music' } : null,
    ].filter(Boolean).map(l =>
      `<a class="album-link" href="${l.url}" target="_blank" rel="noopener">▶ ${l.label}</a>`
    ).join('');
    return `<div class="album">
        <div class="album-head">
          <div class="album-cover" style="${a.cover ? `background-image:url('${a.cover}')` : ''}"></div>
          <div class="album-info">
            <div class="album-title">${esc(a.titulo)}</div>
            <div class="album-year">${esc(a.anio)}</div>
            <div class="album-links">${links}</div>
          </div>
        </div>
        ${tracksHtml}
      </div>`;
  }

  const list = document.getElementById('list');
  list.innerHTML = ALBUMS.map((a, i) => renderAlbum(a, i)).join('');

  list.addEventListener('click', (e) => {
    const btn = e.target.closest('.track-play');
    if(!btn) return;
    const embed = document.getElementById(btn.dataset.embed);
    if(embed.classList.contains('open')){
      embed.classList.remove('open');
      embed.innerHTML = '';
      return;
    }
    document.querySelectorAll('.track-embed.open').forEach(el => { el.classList.remove('open'); el.innerHTML = ''; });
    embed.innerHTML = `<iframe src="https://open.spotify.com/embed/track/${btn.dataset.spotifyId}?utm_source=generator" height="152" allow="encrypted-media" loading="lazy"></iframe>`;
    embed.classList.add('open');
  });
</script>
</body>
</html>
