<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Hoja imprimible</title>
<style>
  :root{
    --bg1:#1a1a2e; --bg2:#16213e; --accent:#e94560; --accent2:#ffd166; --text:#ffffff;
  }
  .theme-cumpleanos{ --bg1:#3a0d5c; --bg2:#7b2d8e; --accent:#ff6fb5; --accent2:#ffd166; }
  .theme-fiesta{ --bg1:#0f0c29; --bg2:#302b63; --accent:#00f5d4; --accent2:#f15bb5; }
  .theme-evento{ --bg1:#0b0b0b; --bg2:#1c1c1c; --accent:#d4af37; --accent2:#ffffff; }
  .theme-regalo{ --bg1:#5c0011; --bg2:#8e0e3a; --accent:#ff8fa3; --accent2:#ffd166; }

  * { box-sizing: border-box; }
  @page{ size: A4; margin: 1cm; }
  body{
    margin:0; padding:1cm; background:#e5e5e5;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  h2.section-label{
    font-size:12px; color:#888; text-transform:uppercase; letter-spacing:.08em;
    margin:0 0 0.4cm; font-weight:600;
  }
  .sheet{
    display:grid; grid-template-columns:repeat(2, 8.56cm); gap:0.6cm;
    justify-content:center; margin-bottom:1cm;
  }
  .page-break{ break-before:page; }

  /* Tamaño real de tarjeta de crédito (ISO/IEC 7810 ID-1): 8.56cm x 5.4cm */
  .card{
    width:8.56cm; height:5.4cm; border-radius:0.3cm; overflow:hidden; position:relative;
    color:var(--text); box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  .cut-guide{
    position:absolute; inset:1px; border:1px dashed rgba(255,255,255,.35);
    border-radius:0.3cm; pointer-events:none; z-index:5;
  }

  .front{ background-color:var(--accent); background-size:cover; background-position:center; }
  .front::before{
    content:''; position:absolute; inset:0;
    background:linear-gradient(to top, rgba(0,0,0,.75) 0%, rgba(0,0,0,.1) 55%, transparent 75%);
  }
  .front .caption{ position:absolute; left:0.3cm; right:0.3cm; bottom:0.22cm; z-index:2; }
  .front .titulo{
    font-size:9.5pt; font-weight:800; line-height:1.15; margin:0 0 0.08cm;
    text-shadow:0 2px 6px rgba(0,0,0,.6);
  }
  .front .flip-note{
    display:inline-flex; align-items:center; gap:4px; font-size:6.5pt; font-weight:600;
    background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.35);
    padding:2px 8px; border-radius:10px;
  }

  .back{
    background:linear-gradient(160deg, var(--bg2), var(--bg1));
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0.18cm;
  }
  .back .titulo{
    font-size:9pt; font-weight:800; margin:0; text-align:center;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .back .qr-box{ background:#fff; padding:0.15cm; border-radius:8px; }
  .back .qr-box img{ width:3.6cm; height:3.6cm; display:block; }
  .back .instruccion{ font-size:7pt; font-weight:600; opacity:.9; margin:0; }

  @media print{
    body{ background:#fff; padding:0; }
    .card{ box-shadow:none; page-break-inside:avoid; }
    .cut-guide{ border-color:#ccc; }
  }
</style>
</head>
<body>
<h2 class="section-label">Frentes</h2>
<div class="sheet" id="sheetFront"></div>

<h2 class="section-label page-break">Atrás</h2>
<div class="sheet" id="sheetBack"></div>

<script>
  const ITEMS = {{ITEMS_JSON}};

  function esc(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  document.getElementById('sheetFront').innerHTML = ITEMS.map(it => `
    <div class="card front theme-${it.tema}" style="background-image:url('${it.cover}')">
      <div class="cut-guide"></div>
      <div class="caption">
        <p class="titulo">${esc(it.titulo)}</p>
        <span class="flip-note">QR al dorso — escaneá del otro lado 👉</span>
      </div>
    </div>
  `).join('');

  document.getElementById('sheetBack').innerHTML = ITEMS.map(it => `
    <div class="card back theme-${it.tema}">
      <div class="cut-guide"></div>
      <p class="titulo">${esc(it.titulo)}</p>
      <div class="qr-box"><img src="${it.qr}" alt="QR"></div>
      <p class="instruccion">📱 Escaneá para escuchar</p>
    </div>
  `).join('');
</script>
</body>
</html>
