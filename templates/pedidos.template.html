<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Armar pedido — ScanBeat</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{ --bg1:#1a1a2e; --bg2:#16213e; --accent:#e94560; --accent2:#ffd166; --text:#ffffff; }
  .theme-cumpleanos{ --bg1:#3a0d5c; --bg2:#7b2d8e; --accent:#ff6fb5; --accent2:#ffd166; }
  .theme-fiesta{ --bg1:#0f0c29; --bg2:#302b63; --accent:#00f5d4; --accent2:#f15bb5; }
  .theme-evento{ --bg1:#0b0b0b; --bg2:#1c1c1c; --accent:#d4af37; --accent2:#ffffff; }
  .theme-regalo{ --bg1:#5c0011; --bg2:#8e0e3a; --accent:#ff8fa3; --accent2:#ffd166; }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:radial-gradient(circle at 50% 0%, var(--bg2), var(--bg1));
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text); min-height:100vh;
  }
  a{ color:inherit; }
  button{ font-family:inherit; cursor:pointer; }

  /* ---------- Selector ---------- */
  #selector{ max-width:1100px; margin:0 auto; padding:32px 20px 140px; }
  #selector header{ text-align:center; margin-bottom:22px; }
  #selector header a.back{ display:inline-block; margin-bottom:10px; font-size:13px; opacity:.6; text-decoration:none; }
  #selector h1{
    margin:0 0 6px; font-size:clamp(24px,6vw,32px); font-weight:800; letter-spacing:-.02em;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  #selector .sub{ margin:0; opacity:.65; font-size:13.5px; }

  #orderName, #search{
    display:block; width:100%; max-width:420px; margin:0 auto 14px; padding:12px 16px;
    border-radius:12px; border:1px solid rgba(255,255,255,.15); background:rgba(255,255,255,.06);
    color:var(--text); font-size:15px; outline:none;
  }
  #search{ margin-bottom:22px; }
  #orderName{ border-color:rgba(255,209,102,.35); font-weight:700; }
  #orderName::placeholder, #search::placeholder{ color:rgba(255,255,255,.4); }
  #orderName:focus, #search:focus{ border-color:var(--accent2); }

  #printview .order-label{
    font-size:9pt; font-weight:700; color:#555; margin:0 0 0.3cm; text-align:left;
  }

  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:12px;
  }
  .tile{
    display:block; width:100%; border:2px solid transparent; border-radius:12px; overflow:hidden;
    position:relative; aspect-ratio:1; background:#111; padding:0; text-align:left;
  }
  .tile img{ width:100%; height:100%; object-fit:cover; display:block; opacity:.9; }
  .tile span{
    position:absolute; left:0; right:0; bottom:0; padding:7px 8px; font-size:11px; font-weight:700;
    background:linear-gradient(to top, rgba(0,0,0,.92), transparent 70%); line-height:1.25;
    text-transform:uppercase; letter-spacing:.02em;
  }
  .tile.selected{ border-color:var(--accent2); }
  .tile.selected::after{
    content:''; position:absolute; top:6px; right:6px; width:22px; height:22px; border-radius:50%;
    background:var(--accent2) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="%23111" d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>') center/14px no-repeat;
    box-shadow:0 2px 6px rgba(0,0,0,.4);
  }
  .empty-msg{ text-align:center; opacity:.5; padding:30px; grid-column:1/-1; font-size:13.5px; }

  /* ---------- Barra inferior fija ---------- */
  #bar{
    position:fixed; left:0; right:0; bottom:0; z-index:10;
    background:rgba(15,15,26,.92); backdrop-filter:blur(10px);
    border-top:1px solid rgba(255,255,255,.1);
    padding:12px 20px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    justify-content:center;
  }
  #bar .info{ font-size:13.5px; opacity:.85; margin-right:auto; }
  #bar .info b{ color:var(--accent2); }
  #bar button{
    border:none; border-radius:20px; padding:11px 20px; font-weight:800; font-size:13.5px;
  }
  #bar .btn-clear{ background:transparent; color:var(--text); opacity:.6; border:1px solid rgba(255,255,255,.2); }
  #bar .btn-generate{
    background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#111;
    box-shadow:0 8px 20px rgba(0,0,0,.4);
  }
  #bar .btn-generate:disabled{ opacity:.35; box-shadow:none; }

  @media (max-width:520px){
    #bar{ justify-content:stretch; }
    #bar .info{ width:100%; text-align:center; margin:0 0 4px; }
    #bar button{ flex:1; }
  }

  /* ---------- Vista de impresión (misma grilla que hoja-imprimible) ---------- */
  #printview{ display:none; }
  #printview .toolbar{
    max-width:19cm; margin:0 auto 16px; padding:16px 20px 0; display:flex; gap:12px; justify-content:center;
  }
  #printview .toolbar button{
    border:none; border-radius:20px; padding:10px 18px; font-weight:800; font-size:13px;
  }
  #printview .btn-back{ background:transparent; color:var(--text); border:1px solid rgba(255,255,255,.25); }
  #printview .btn-print{ background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#111; }

  #printview .page{ max-width:19cm; margin:0 auto 24px; background:#e5e5e5; padding:2cm 1cm 1cm 1cm; }
  #printview .sheet{ border-collapse:collapse; margin:0 auto; }
  #printview .card-slot{ position:relative; padding:0.4cm; }

  #printview .corner{ position:absolute; width:0.28cm; height:0.28cm; pointer-events:none; }
  #printview .corner-tl{ top:0.4cm; left:0.4cm; margin:-0.28cm 0 0 -0.28cm; border-top:1px solid #999; border-left:1px solid #999; }
  #printview .corner-tr{ top:0.4cm; right:0.4cm; margin:-0.28cm -0.28cm 0 0; border-top:1px solid #999; border-right:1px solid #999; }
  #printview .corner-bl{ bottom:0.4cm; left:0.4cm; margin:0 0 -0.28cm -0.28cm; border-bottom:1px solid #999; border-left:1px solid #999; }
  #printview .corner-br{ bottom:0.4cm; right:0.4cm; margin:0 -0.28cm -0.28cm 0; border-bottom:1px solid #999; border-right:1px solid #999; }

  #printview .card{
    width:8.56cm; height:5.4cm; border-radius:0.3cm; overflow:hidden; position:relative;
    color:#fff; box-shadow:0 4px 14px rgba(0,0,0,.25);
    background-color:var(--accent); background-size:cover; background-position:center top;
  }
  #printview .card.blank{ box-shadow:none; visibility:hidden; }
  #printview .card::before{
    content:''; position:absolute; inset:0;
    background:linear-gradient(to top, rgba(0,0,0,.8) 0%, rgba(0,0,0,.35) 32%, rgba(0,0,0,.05) 55%, transparent 70%);
  }
  #printview .footer{ position:absolute; left:0.3cm; right:1.9cm; bottom:0.22cm; z-index:2; }
  #printview .footer .titulo{ font-size:9.5pt; font-weight:800; line-height:1.15; margin:0 0 0.12cm; text-shadow:0 2px 6px rgba(0,0,0,.6); }
  #printview .footer .brand{ display:flex; flex-direction:column; gap:0.02cm; }
  #printview .footer .domain{ font-size:6.5pt; font-weight:700; opacity:.95; text-shadow:0 1px 3px rgba(0,0,0,.6); }
  #printview .footer .slogan{ font-size:6pt; font-style:italic; opacity:.8; text-shadow:0 1px 3px rgba(0,0,0,.6); }
  #printview .qr-badge{
    position:absolute; right:0.28cm; bottom:0.22cm; z-index:3; width:2.0cm; height:2.0cm; border-radius:6px;
    background:#fff; padding:2px; box-shadow:0 2px 6px rgba(0,0,0,.35), 0 0 0 2px var(--accent2);
  }
  #printview .qr-badge img{ width:100%; height:100%; display:block; border-radius:4px; image-rendering:pixelated; }
  #printview .qr-badge .note{
    position:absolute; top:-8px; left:-8px; width:18px; height:18px; border-radius:50%;
    background:var(--accent2); color:var(--bg1); font-size:10px; font-weight:900;
    display:flex; align-items:center; justify-content:center; box-shadow:0 1px 3px rgba(0,0,0,.4);
  }

  @media print{
    body{ background:#fff !important; }
    #selector, #bar, .no-print{ display:none !important; }
    #printview{ display:block !important; }
    #printview .page{ background:#fff; box-shadow:none; page-break-after:always; }
    #printview .card{ box-shadow:none; page-break-inside:avoid; }
  }
</style>
</head>
<body>

<div id="selector">
  <header>
    <a class="back" href="./">← Volver</a>
    <h1>Armar pedido</h1>
    <p class="sub">Elegí las tarjetas que van en la hoja y armá el PDF para imprimir.</p>
  </header>
  <input id="orderName" type="text" placeholder="Nombre del pedido (ej: Juan Pérez)">
  <input id="search" type="text" placeholder="Buscar artista…">
  <div class="grid" id="grid"></div>
</div>

<div id="bar" class="no-print">
  <span class="info"><b id="count">0</b> tarjeta(s) — <span id="pageCount">0</span> hoja(s) A4</span>
  <button class="btn-clear" id="btnClear">Vaciar selección</button>
  <button class="btn-generate" id="btnGenerate" disabled>Generar hoja imprimible</button>
</div>

<div id="printview">
  <div class="toolbar no-print">
    <button class="btn-back" id="btnBack">← Volver a elegir</button>
    <button class="btn-print" id="btnPrint">🖨️ Imprimir / Guardar PDF</button>
  </div>
  <div id="pages"></div>
</div>

<script>
  const CARDS = {{CARDS_JSON}};
  const BY_SLUG = Object.fromEntries(CARDS.map(c => [c.slug, c]));
  const COLS = 2;
  const ROWS_PER_PAGE = 4;
  const PER_PAGE = COLS * ROWS_PER_PAGE;
  const SLOGAN = 'Escaneá. Escuchá. Repetí.';

  let selected = [];

  function esc(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  const gridEl = document.getElementById('grid');
  const searchEl = document.getElementById('search');
  const orderNameEl = document.getElementById('orderName');
  const countEl = document.getElementById('count');
  const pagesInfoEl = document.getElementById('pageCount');
  const btnGenerate = document.getElementById('btnGenerate');
  const btnClear = document.getElementById('btnClear');
  const originalTitle = document.title;

  orderNameEl.value = localStorage.getItem('scanbeat-ultimo-pedido') || '';

  function renderGrid(){
    const q = searchEl.value.trim().toLowerCase();
    const filtered = q ? CARDS.filter(c => c.titulo.toLowerCase().includes(q)) : CARDS;
    if (!filtered.length) {
      gridEl.innerHTML = '<p class="empty-msg">No hay tarjetas que coincidan.</p>';
      return;
    }
    gridEl.innerHTML = filtered.map(c => `
      <button type="button" class="tile ${selected.includes(c.slug) ? 'selected' : ''}" data-slug="${c.slug}">
        ${c.cover ? `<img src="${c.cover}" alt="${esc(c.titulo)}" loading="lazy">` : ''}
        <span>${esc(c.titulo)}</span>
      </button>`).join('');
  }

  function updateBar(){
    countEl.textContent = selected.length;
    pagesInfoEl.textContent = selected.length ? Math.ceil(selected.length / PER_PAGE) : 0;
    btnGenerate.disabled = selected.length === 0;
  }

  gridEl.addEventListener('click', (e) => {
    const tile = e.target.closest('.tile');
    if (!tile) return;
    const slug = tile.dataset.slug;
    const i = selected.indexOf(slug);
    if (i === -1) selected.push(slug); else selected.splice(i, 1);
    renderGrid();
    updateBar();
  });

  searchEl.addEventListener('input', renderGrid);

  btnClear.addEventListener('click', () => {
    selected = [];
    renderGrid();
    updateBar();
  });

  function cardHtml(it){
    if (!it) return '<div class="card-slot"></div>';
    return `
      <div class="card-slot">
        <span class="corner corner-tl"></span>
        <span class="corner corner-tr"></span>
        <span class="corner corner-bl"></span>
        <span class="corner corner-br"></span>
        <div class="card theme-${it.tema}" style="background-image:url('${it.cover}')">
          <div class="footer">
            <p class="titulo">${esc(it.titulo)}</p>
            <div class="brand">
              <span class="domain">🌐 scanbeat.com.ar</span>
              <span class="slogan">"${esc(SLOGAN)}"</span>
            </div>
          </div>
          <div class="qr-badge">
            <span class="note">♪</span>
            <img src="${it.qr}" alt="QR">
          </div>
        </div>
      </div>`;
  }

  function toRows(items){
    const rows = [];
    for (let i = 0; i < items.length; i += COLS) {
      const row = items.slice(i, i + COLS);
      while (row.length < COLS) row.push(null);
      rows.push(row);
    }
    return rows;
  }

  function buildTable(rows){
    const rowsHtml = rows.map(row =>
      '<tr>' + row.map(it => `<td>${cardHtml(it)}</td>`).join('') + '</tr>'
    ).join('');
    return `<table class="sheet">${rowsHtml}</table>`;
  }

  const pagesEl = document.getElementById('pages');

  function fechaCorta(){
    const d = new Date();
    return d.toLocaleDateString('es-AR');
  }

  function renderPrintView(){
    const nombre = orderNameEl.value.trim();
    localStorage.setItem('scanbeat-ultimo-pedido', nombre);

    const items = selected.map(slug => BY_SLUG[slug]).filter(Boolean);
    pagesEl.innerHTML = '';
    const totalPages = Math.ceil(items.length / PER_PAGE) || 1;
    const labelHtml = nombre
      ? `<p class="order-label">Pedido: ${esc(nombre)} — ${items.length} tarjeta(s) — ${fechaCorta()}</p>`
      : '';
    for (let p = 0; p < totalPages; p++) {
      const chunk = items.slice(p * PER_PAGE, (p + 1) * PER_PAGE);
      const page = document.createElement('div');
      page.className = 'page';
      page.innerHTML = labelHtml + buildTable(toRows(chunk));
      pagesEl.appendChild(page);
    }

    document.title = nombre ? `Pedido - ${nombre}` : 'Hoja imprimible - ScanBeat';

    document.getElementById('selector').style.display = 'none';
    document.getElementById('bar').style.display = 'none';
    document.getElementById('printview').style.display = 'block';
    window.scrollTo(0, 0);
  }

  btnGenerate.addEventListener('click', renderPrintView);

  document.getElementById('btnBack').addEventListener('click', () => {
    document.getElementById('printview').style.display = 'none';
    document.getElementById('selector').style.display = 'block';
    document.getElementById('bar').style.display = 'flex';
    document.title = originalTitle;
  });

  document.getElementById('btnPrint').addEventListener('click', () => window.print());

  renderGrid();
  updateBar();
</script>
</body>
</html>
