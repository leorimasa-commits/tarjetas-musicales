<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin — Reporte de pedidos — ScanBeat</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1a1a2e">
<style>
  :root{ --bg1:#1a1a2e; --bg2:#16213e; --accent:#e94560; --accent2:#ffd166; --text:#ffffff; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:radial-gradient(circle at 50% 0%, var(--bg2), var(--bg1));
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text); min-height:100vh;
  }
  a{ color:inherit; }
  button{ font-family:inherit; cursor:pointer; }

  main{ max-width:760px; margin:0 auto; padding:32px 20px 80px; }
  header{ text-align:center; margin-bottom:22px; }
  header .links{ display:flex; justify-content:center; gap:16px; margin-bottom:10px; font-size:13px; opacity:.65; }
  h1{
    margin:0 0 6px; font-size:clamp(24px,6vw,32px); font-weight:800; letter-spacing:-.02em;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  header p{ margin:0; opacity:.65; font-size:13.5px; }

  .toolbar{ display:flex; justify-content:center; gap:10px; margin:18px 0 24px; }
  .btn-refresh{
    border:none; border-radius:20px; padding:10px 18px; font-weight:800; font-size:13px;
    background:rgba(255,255,255,.08); color:var(--text); border:1px solid rgba(255,255,255,.15);
  }
  .status-msg{ text-align:center; opacity:.6; font-size:13.5px; padding:30px 0; }

  .order-card{
    border:1px solid rgba(255,255,255,.12); border-radius:14px; padding:16px 18px; margin-bottom:14px;
    background:rgba(255,255,255,.03);
  }
  .order-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:6px; }
  .order-name{ font-size:15px; font-weight:800; }
  .order-date{ font-size:11.5px; opacity:.5; white-space:nowrap; }
  .order-contacto{ font-size:13px; opacity:.75; margin-bottom:10px; }
  .badge{
    display:inline-block; font-size:10.5px; font-weight:800; padding:3px 10px; border-radius:12px;
    text-transform:uppercase; letter-spacing:.03em; margin-bottom:10px;
  }
  .badge.pagado{ background:rgba(120,220,150,.18); color:#8ee6a8; }
  .badge.pendiente{ background:rgba(255,180,80,.18); color:#ffc266; }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .chip{
    display:inline-block; padding:4px 10px; border-radius:14px; background:rgba(255,255,255,.08);
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.02em;
  }
  .order-comentario{ font-size:12.5px; opacity:.7; font-style:italic; margin:0 0 12px; }
  .order-actions{ display:flex; flex-wrap:wrap; gap:8px; }
  .order-actions a, .order-actions button{
    border:none; border-radius:18px; padding:9px 16px; font-weight:800; font-size:12.5px;
    text-decoration:none; display:inline-flex; align-items:center; gap:6px;
  }
  .btn-pdf{ background:rgba(255,255,255,.08); color:var(--text); border:1px solid rgba(255,255,255,.15) !important; }
  .btn-send{ background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#111; }
  .btn-send:disabled{ opacity:.5; }
</style>
</head>
<body>
<main>
  <header>
    <div class="links">
      <a href="../">← Sitio</a>
      <a href="pedidos.html">Armar hoja →</a>
    </div>
    <h1>Reporte de pedidos</h1>
    <p>Pedidos recibidos desde el formulario público, más recientes primero.</p>
  </header>

  <div class="toolbar">
    <button class="btn-refresh" id="btnRefresh">🔄 Actualizar</button>
  </div>

  <div id="content"><p class="status-msg">Cargando pedidos…</p></div>
</main>

<script>
  const SHEETS_WEBAPP_URL = '{{SHEETS_WEBAPP_URL}}';

  const contentEl = document.getElementById('content');
  const btnRefresh = document.getElementById('btnRefresh');

  function esc(s){
    const d = document.createElement('div');
    d.textContent = s == null ? '' : s;
    return d.innerHTML;
  }

  function formatFecha(iso){
    try {
      const d = new Date(iso);
      return d.toLocaleDateString('es-AR') + ' ' + d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
    } catch { return iso; }
  }

  function mensajeParaCliente(o){
    const nombres = o.discografias.split(',').map(s => s.trim()).filter(Boolean).join(', ');
    const saludo = `¡Hola${o.nombre ? ' ' + o.nombre : ''}! 🎵`;
    if (o.pdf) {
      return `${saludo} Acá tenés la hoja de tu pedido de ScanBeat (${nombres}):\n\n${o.pdf}\n\n¡Gracias por tu compra!`;
    }
    return `${saludo} Tu pedido de ScanBeat: ${nombres}.\n\nEn breve te mandamos la hoja imprimible. ¡Gracias por tu compra!`;
  }

  function esEmail(contacto){
    return (contacto || '').trim().includes('@');
  }

  function waUrlFor(contacto, mensaje){
    const soloNumeros = (contacto || '').trim().replace(/\D/g, '');
    return `https://wa.me/${soloNumeros}?text=${encodeURIComponent(mensaje)}`;
  }

  let ORDERS = [];

  function orderCardHtml(o, idx){
    const chips = o.discografias.split(',').map(s => s.trim()).filter(Boolean)
      .map(n => `<span class="chip">${esc(n)}</span>`).join('');
    const mensaje = mensajeParaCliente(o);
    const accionHtml = esEmail(o.contacto)
      ? `<button type="button" class="btn-send" data-send-mail="${idx}">📩 Enviar tarjetas al cliente</button>`
      : `<a class="btn-send" href="${waUrlFor(o.contacto, mensaje)}" target="_blank" rel="noopener">📱 Enviar por WhatsApp</a>`;
    return `
      <div class="order-card">
        <div class="order-head">
          <span class="order-name">${esc(o.nombre)}</span>
          <span class="order-date">${formatFecha(o.fecha)}</span>
        </div>
        <p class="order-contacto">${esc(o.contacto)}</p>
        <span class="badge ${o.pagado ? 'pagado' : 'pendiente'}">${o.pagado ? '✅ Pagado' : '⏳ Pendiente de pago'}</span>
        <div class="chips">${chips}</div>
        ${o.comentario ? `<p class="order-comentario">"${esc(o.comentario)}"</p>` : ''}
        <div class="order-actions">
          ${o.pdf ? `<a class="btn-pdf" href="${esc(o.pdf)}" target="_blank" rel="noopener">📄 Ver PDF</a>` : ''}
          ${accionHtml}
        </div>
      </div>`;
  }

  async function cargarPedidos(){
    if (!SHEETS_WEBAPP_URL) {
      contentEl.innerHTML = '<p class="status-msg">Todavía no está conectada la planilla de pedidos (SHEETS_WEBAPP_URL vacío).</p>';
      return;
    }
    contentEl.innerHTML = '<p class="status-msg">Cargando pedidos…</p>';
    try {
      const res = await fetch(SHEETS_WEBAPP_URL, { cache: 'no-store' });
      const data = await res.json();
      if (!Array.isArray(data)) throw new Error(data && data.error ? data.error : 'Respuesta inesperada');
      ORDERS = data;
      if (!data.length) {
        contentEl.innerHTML = '<p class="status-msg">Todavía no llegó ningún pedido.</p>';
        return;
      }
      contentEl.innerHTML = data.map(orderCardHtml).join('');
    } catch (err) {
      console.error(err);
      contentEl.innerHTML = '<p class="status-msg">⚠️ No se pudo cargar el reporte. Probá "Actualizar" de nuevo.</p>';
    }
  }

  contentEl.addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-send-mail]');
    if (!btn) return;
    const o = ORDERS[Number(btn.dataset.sendMail)];
    if (!o) return;
    const mensaje = mensajeParaCliente(o);
    btn.disabled = true;
    btn.textContent = 'Enviando…';
    try {
      const res = await fetch(SHEETS_WEBAPP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({
          tipo: 'enviarMail',
          contacto: o.contacto,
          asunto: 'Tu pedido de ScanBeat 🎵',
          mensaje,
        }),
      });
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || 'Error desconocido');
      btn.textContent = '✅ Enviado';
    } catch (err) {
      console.error(err);
      btn.textContent = '⚠️ Error — reintentar';
      btn.disabled = false;
    }
  });

  btnRefresh.addEventListener('click', cargarPedidos);
  cargarPedidos();
</script>
</body>
</html>
