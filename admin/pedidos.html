<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin — Armar hoja — ScanBeat</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{ --bg1:#1a1a2e; --bg2:#16213e; --accent:#e94560; --accent2:#ffd166; --text:#ffffff; }
  .theme-cumpleanos{ --bg1:#3a0d5c; --bg2:#7b2d8e; --accent:#ff6fb5; --accent2:#ffd166; }
  .theme-fiesta{ --bg1:#0f0c29; --bg2:#302b63; --accent:#00f5d4; --accent2:#f15bb5; }
  .theme-evento{ --bg1:#0b0b0b; --bg2:#1c1c1c; --accent:#d4af37; --accent2:#ffffff; }
  .theme-regalo{ --bg1:#5c0011; --bg2:#8e0e3a; --accent:#ff8fa3; --accent2:#ffd166; }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:radial-gradient(circle at 50% 0%, var(--bg2), var(--bg1));
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text); min-height:100vh;
  }
  a{ color:inherit; }
  button{ font-family:inherit; cursor:pointer; }

  /* ---------- Selector ---------- */
  #selector{ max-width:1100px; margin:0 auto; padding:32px 20px 140px; }
  #selector header{ text-align:center; margin-bottom:22px; }
  #selector header .links{ display:flex; justify-content:center; gap:16px; margin-bottom:10px; font-size:13px; opacity:.65; }
  #selector header a{ text-decoration:none; }
  #selector h1{
    margin:0 0 6px; font-size:clamp(24px,6vw,32px); font-weight:800; letter-spacing:-.02em;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  #selector .sub{ margin:0; opacity:.65; font-size:13.5px; }

  .fields{ display:flex; gap:10px; max-width:420px; margin:0 auto 14px; flex-wrap:wrap; }
  .fields > *{ flex:1; min-width:140px; }

  #orderName, #orderPrice, #search{
    display:block; width:100%; padding:12px 16px;
    border-radius:12px; border:1px solid rgba(255,255,255,.15); background:rgba(255,255,255,.06);
    color:var(--text); font-size:15px; outline:none;
  }
  #search{ max-width:420px; margin:0 auto 22px; }
  #orderName, #orderPrice{ border-color:rgba(255,209,102,.35); font-weight:700; }
  #orderName::placeholder, #orderPrice::placeholder, #search::placeholder{ color:rgba(255,255,255,.4); }
  #orderName:focus, #orderPrice:focus, #search:focus{ border-color:var(--accent2); }

  /* ---------- Resumen de hojas ---------- */
  #summary{ max-width:720px; margin:0 auto 26px; display:flex; flex-direction:column; gap:14px; }
  .sheet-block{
    border:1px solid rgba(255,255,255,.12); border-radius:14px; padding:12px 14px;
    background:rgba(255,255,255,.03);
  }
  .sheet-block.complete{ border-color:rgba(255,209,102,.4); background:rgba(255,209,102,.06); }
  .sheet-block-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .sheet-block-head b{ font-size:13.5px; }
  .sheet-block-head .frac{ font-size:12px; opacity:.65; }
  .sheet-dots{ display:flex; gap:4px; margin-bottom:10px; }
  .sheet-dots span{
    flex:1; height:6px; border-radius:3px; background:rgba(255,255,255,.12);
  }
  .sheet-dots span.filled{ background:linear-gradient(90deg,var(--accent),var(--accent2)); }
  .sheet-chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{
    display:inline-flex; align-items:center; gap:6px; padding:5px 6px 5px 10px;
    border-radius:16px; background:rgba(255,255,255,.08); font-size:11.5px; font-weight:700;
    text-transform:uppercase; letter-spacing:.02em;
  }
  .chip button{
    border:none; background:rgba(255,255,255,.15); color:var(--text); width:16px; height:16px;
    border-radius:50%; font-size:10px; line-height:1; display:flex; align-items:center; justify-content:center;
    padding:0;
  }
  .chip button:hover{ background:var(--accent); }

  /* ---------- Aviso de hoja nueva ---------- */
  #toast{
    position:fixed; top:16px; left:50%; transform:translateX(-50%) translateY(-140%);
    background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#111; font-weight:800;
    font-size:13.5px; padding:12px 20px; border-radius:14px; box-shadow:0 10px 26px rgba(0,0,0,.5);
    z-index:20; transition:transform .35s ease; text-align:center; max-width:88vw;
  }
  #toast.show{ transform:translateX(-50%) translateY(0); }

  #printview .order-label{
    font-size:9pt; font-weight:700; color:#555; margin:0 0 0.3cm; text-align:left;
  }

  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:12px;
  }
  .tile{
    display:block; width:100%; border:2px solid transparent; border-radius:12px; overflow:hidden;
    position:relative; background:#111; padding:0; text-align:left;
  }
  .tile-thumb{ position:relative; width:100%; aspect-ratio:1; overflow:hidden; }
  .tile-thumb img{ width:100%; height:100%; object-fit:cover; display:block; opacity:.9; }
  .tile span{
    display:block; padding:7px 8px 8px; font-size:11px; font-weight:800; line-height:1.3;
    color:var(--text); text-transform:uppercase; letter-spacing:.03em;
    background:rgba(255,255,255,.05);
  }
  .tile.selected{ border-color:var(--accent2); }
  .tile.selected .tile-thumb::after{
    content:''; position:absolute; top:6px; right:6px; width:22px; height:22px; border-radius:50%;
    background:var(--accent2) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="%23111" d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>') center/14px no-repeat;
    box-shadow:0 2px 6px rgba(0,0,0,.4);
  }
  .tile.selected span{ background:rgba(255,209,102,.15); color:var(--accent2); }
  .empty-msg{ text-align:center; opacity:.5; padding:30px; grid-column:1/-1; font-size:13.5px; }

  /* ---------- Barra inferior fija ---------- */
  #bar{
    position:fixed; left:0; right:0; bottom:0; z-index:10;
    background:rgba(15,15,26,.92); backdrop-filter:blur(10px);
    border-top:1px solid rgba(255,255,255,.1);
    padding:12px 20px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    justify-content:center;
  }
  #bar .info{ font-size:13.5px; opacity:.85; margin-right:auto; }
  #bar .info b{ color:var(--accent2); }
  #bar button{
    border:none; border-radius:20px; padding:11px 20px; font-weight:800; font-size:13.5px;
  }
  #bar .btn-clear{ background:transparent; color:var(--text); opacity:.6; border:1px solid rgba(255,255,255,.2); }
  #bar .btn-generate{
    background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#111;
    box-shadow:0 8px 20px rgba(0,0,0,.4);
  }
  #bar .btn-generate:disabled{ opacity:.35; box-shadow:none; }

  @media (max-width:520px){
    #bar{ justify-content:stretch; }
    #bar .info{ width:100%; text-align:center; margin:0 0 4px; }
    #bar button{ flex:1; }
  }

  /* ---------- Vista de impresión (misma grilla que hoja-imprimible) ---------- */
  #printview{ display:none; }
  #printview .toolbar{
    max-width:20.9cm; margin:0 auto 16px; padding:16px 20px 0; display:flex; gap:12px; justify-content:center;
  }
  #printview .toolbar button{
    border:none; border-radius:20px; padding:10px 18px; font-weight:800; font-size:13px;
  }
  #printview .btn-back{ background:transparent; color:var(--text); border:1px solid rgba(255,255,255,.25); }
  #printview .btn-print{ background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#111; }

  /* Ancho real necesario para 2 columnas de tarjeta (8.56cm + 0.4cm de padding a cada
     lado del card-slot = 9.36cm cada una) + el padding de .page (1cm a cada lado) =
     20.72cm. Con 19cm la segunda columna se salía de la caja de .page — quedaba
     desalineada/se veía cortada contra el fondo gris. */
  #printview .page{ max-width:20.9cm; margin:0 auto 24px; background:#e5e5e5; padding:2cm 1cm 1cm 1cm; }
  #printview .sheet{ border-collapse:collapse; margin:0 auto; }
  #printview .card-slot{ position:relative; padding:0.4cm; }

  #printview .corner{ position:absolute; width:0.28cm; height:0.28cm; pointer-events:none; }
  #printview .corner-tl{ top:0.4cm; left:0.4cm; margin:-0.28cm 0 0 -0.28cm; border-top:1px solid #999; border-left:1px solid #999; }
  #printview .corner-tr{ top:0.4cm; right:0.4cm; margin:-0.28cm -0.28cm 0 0; border-top:1px solid #999; border-right:1px solid #999; }
  #printview .corner-bl{ bottom:0.4cm; left:0.4cm; margin:0 0 -0.28cm -0.28cm; border-bottom:1px solid #999; border-left:1px solid #999; }
  #printview .corner-br{ bottom:0.4cm; right:0.4cm; margin:0 -0.28cm -0.28cm 0; border-bottom:1px solid #999; border-right:1px solid #999; }

  #printview .card{
    width:8.56cm; height:5.4cm; border-radius:0.3cm; overflow:hidden; position:relative;
    color:#fff; box-shadow:0 4px 14px rgba(0,0,0,.25); background-color:var(--accent);
  }
  #printview .card.blank{ box-shadow:none; visibility:hidden; }
  /* Tapa y degradado como <img> reales, no CSS background: así se imprimen siempre,
     sin depender de la casilla "Gráficos de fondo" del diálogo de impresión. */
  #printview .card-cover, #printview .card-shade{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  #printview .card-cover{ object-fit:cover; object-position:center top; z-index:0; }
  #printview .card-shade{ z-index:1; pointer-events:none; }
  #printview .footer{ position:absolute; left:0.3cm; right:1.9cm; bottom:0.22cm; z-index:2; }
  #printview .footer .titulo{ font-size:9.5pt; font-weight:800; line-height:1.15; margin:0 0 0.12cm; text-shadow:0 2px 6px rgba(0,0,0,.6); }
  #printview .footer .brand{ display:flex; flex-direction:column; gap:0.02cm; }
  #printview .footer .domain{ font-size:6.5pt; font-weight:700; opacity:.95; text-shadow:0 1px 3px rgba(0,0,0,.6); }
  #printview .footer .slogan{ font-size:6pt; font-style:italic; opacity:.8; text-shadow:0 1px 3px rgba(0,0,0,.6); }
  #printview .qr-badge{
    position:absolute; right:0.28cm; bottom:0.22cm; z-index:3; width:2.0cm; height:2.0cm; border-radius:6px;
    background:#fff; padding:2px; box-shadow:0 2px 6px rgba(0,0,0,.35), 0 0 0 2px var(--accent2);
  }
  #printview .qr-badge img{ width:100%; height:100%; display:block; border-radius:4px; image-rendering:pixelated; }
  #printview .qr-badge .note{
    position:absolute; top:-8px; left:-8px; width:18px; height:18px; border-radius:50%;
    background:var(--accent2); color:var(--bg1); font-size:10px; font-weight:900;
    display:flex; align-items:center; justify-content:center; box-shadow:0 1px 3px rgba(0,0,0,.4);
  }

  @media print{
    *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; color-adjust:exact !important; }
    body{ background:#fff !important; }
    #selector, #bar, .no-print{ display:none !important; }
    #printview{ display:block !important; }
    #printview .page{ background:#fff; box-shadow:none; page-break-after:always; }
    #printview .card{ box-shadow:none; page-break-inside:avoid; }
  }
</style>
</head>

</div>

  let selected = [];

  function esc(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  const gridEl = document.getElementById('grid');
  const searchEl = document.getElementById('search');
  const orderNameEl = document.getElementById('orderName');
  const orderPriceEl = document.getElementById('orderPrice');
  const summaryEl = document.getElementById('summary');
  const toastEl = document.getElementById('toast');
  const countEl = document.getElementById('count');
  const pagesInfoEl = document.getElementById('pageCount');
  const priceInfoEl = document.getElementById('priceInfo');
  const btnGenerate = document.getElementById('btnGenerate');
  const btnClear = document.getElementById('btnClear');
  const originalTitle = document.title;

  orderNameEl.value = localStorage.getItem('scanbeat-ultimo-pedido') || '';
  orderPriceEl.value = localStorage.getItem('scanbeat-precio-hoja') || '';

  function sheetsOf(list){
    const chunks = [];
    for (let i = 0; i < list.length; i += PER_PAGE) chunks.push(list.slice(i, i + PER_PAGE));
    return chunks;
  }

  let toastTimer = null;
  function showToast(msg){
    clearTimeout(toastTimer);
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3200);
  }

  function renderGrid(){
    const q = searchEl.value.trim().toLowerCase();
    const filtered = q ? CARDS.filter(c => c.titulo.toLowerCase().includes(q)) : CARDS;
    if (!filtered.length) {
      gridEl.innerHTML = '<p class="empty-msg">No hay tarjetas que coincidan.</p>';
      return;
    }
    gridEl.innerHTML = filtered.map(c => `
      <button type="button" class="tile ${selected.includes(c.slug) ? 'selected' : ''}" data-slug="${c.slug}">
        <div class="tile-thumb">
          ${c.cover ? `<img src="${c.cover}" alt="${esc(c.titulo)}" loading="lazy">` : ''}
        </div>
        <span>${esc(c.titulo)}</span>
      </button>`).join('');
  }

  function renderSummary(){
    if (!selected.length) { summaryEl.innerHTML = ''; return; }
    const chunks = sheetsOf(selected);
    summaryEl.innerHTML = chunks.map((chunk, idx) => {
      const dots = Array.from({ length: PER_PAGE }, (_, i) =>
        `<span class="${i < chunk.length ? 'filled' : ''}"></span>`).join('');
      const chips = chunk.map(slug => {
        const c = BY_SLUG[slug];
        return `<span class="chip">${esc(c.titulo)}<button type="button" data-remove="${slug}">×</button></span>`;
      }).join('');
      const complete = chunk.length === PER_PAGE ? 'complete' : '';
      return `
        <div class="sheet-block ${complete}">
          <div class="sheet-block-head">
            <b>Hoja ${idx + 1}</b>
            <span class="frac">${chunk.length}/${PER_PAGE}${complete ? ' — completa' : ''}</span>
          </div>
          <div class="sheet-dots">${dots}</div>
          <div class="sheet-chips">${chips}</div>
        </div>`;
    }).join('');
  }

  function updateBar(){
    countEl.textContent = selected.length;
    const totalSheets = selected.length ? Math.ceil(selected.length / PER_PAGE) : 0;
    pagesInfoEl.textContent = totalSheets;
    btnGenerate.disabled = selected.length === 0;

    const precio = parseFloat(orderPriceEl.value);
    if (precio > 0 && totalSheets > 0) {
      const total = precio * totalSheets;
      priceInfoEl.textContent = ` — Total: $${total.toLocaleString('es-AR')} (${totalSheets} × $${precio.toLocaleString('es-AR')})`;
    } else {
      priceInfoEl.textContent = '';
    }
  }

  function addSlug(slug){
    const sheetsBefore = Math.ceil(selected.length / PER_PAGE);
    selected.push(slug);
    const sheetsAfter = Math.ceil(selected.length / PER_PAGE);
    if (sheetsAfter > sheetsBefore) {
      showToast(`🆕 Empezaste la Hoja ${sheetsAfter} — cada hoja nueva tiene su propio costo`);
    }
  }

  function removeSlug(slug){
    const i = selected.indexOf(slug);
    if (i !== -1) selected.splice(i, 1);
  }

  gridEl.addEventListener('click', (e) => {
    const tile = e.target.closest('.tile');
    if (!tile) return;
    const slug = tile.dataset.slug;
    if (selected.includes(slug)) removeSlug(slug); else addSlug(slug);
    renderGrid();
    renderSummary();
    updateBar();
  });

  summaryEl.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-remove]');
    if (!btn) return;
    removeSlug(btn.dataset.remove);
    renderGrid();
    renderSummary();
    updateBar();
  });

  searchEl.addEventListener('input', renderGrid);

  orderPriceEl.addEventListener('input', () => {
    localStorage.setItem('scanbeat-precio-hoja', orderPriceEl.value);
    updateBar();
  });

  btnClear.addEventListener('click', () => {
    selected = [];
    renderGrid();
    renderSummary();
    updateBar();
  });

  const SHADE_SRC = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10' preserveAspectRatio='none'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='1' x2='0' y2='0'%3E%3Cstop offset='0%25' stop-color='black' stop-opacity='0.8'/%3E%3Cstop offset='32%25' stop-color='black' stop-opacity='0.35'/%3E%3Cstop offset='55%25' stop-color='black' stop-opacity='0.05'/%3E%3Cstop offset='70%25' stop-color='black' stop-opacity='0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='10' height='10' fill='url(%23g)'/%3E%3C/svg%3E";
  const BLANK_PX = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBTAA7';

  function cardHtml(it){
    if (!it) return '<div class="card-slot"></div>';
    return `
      <div class="card-slot">
        <span class="corner corner-tl"></span>
        <span class="corner corner-tr"></span>
        <span class="corner corner-bl"></span>
        <span class="corner corner-br"></span>
        <div class="card theme-${it.tema}">
          <img class="card-cover" src="${it.cover || BLANK_PX}" alt="">
          <img class="card-shade" src="${SHADE_SRC}" alt="">
          <div class="footer">
            <p class="titulo">${esc(it.titulo)}</p>
            <div class="brand">
              <span class="domain">🌐 scanbeat.com.ar</span>
              <span class="slogan">"${esc(SLOGAN)}"</span>
            </div>
          </div>
          <div class="qr-badge">
            <span class="note">♪</span>
            <img src="${it.qr}" alt="QR">
          </div>
        </div>
      </div>`;
  }

  function toRows(items){
    const rows = [];
    for (let i = 0; i < items.length; i += COLS) {
      const row = items.slice(i, i + COLS);
      while (row.length < COLS) row.push(null);
      rows.push(row);
    }
    return rows;
  }

  function buildTable(rows){
    const rowsHtml = rows.map(row =>
      '<tr>' + row.map(it => `<td>${cardHtml(it)}</td>`).join('') + '</tr>'
    ).join('');
    return `<table class="sheet">${rowsHtml}</table>`;
  }

  const pagesEl = document.getElementById('pages');

  function fechaCorta(){
    const d = new Date();
    return d.toLocaleDateString('es-AR');
  }

  function renderPrintView(){
    const nombre = orderNameEl.value.trim();
    localStorage.setItem('scanbeat-ultimo-pedido', nombre);
    const precio = parseFloat(orderPriceEl.value);

    const items = selected.map(slug => BY_SLUG[slug]).filter(Boolean);
    pagesEl.innerHTML = '';
    const totalPages = Math.ceil(items.length / PER_PAGE) || 1;
    const precioTxt = precio > 0
      ? ` — $${precio.toLocaleString('es-AR')}/hoja, total $${(precio * totalPages).toLocaleString('es-AR')}`
      : '';
    for (let p = 0; p < totalPages; p++) {
      const chunk = items.slice(p * PER_PAGE, (p + 1) * PER_PAGE);
      const encabezado = nombre
        ? `Pedido: ${esc(nombre)} — Hoja ${p + 1} de ${totalPages}${precioTxt} — ${fechaCorta()}`
        : `Hoja ${p + 1} de ${totalPages}${precioTxt}`;
      const page = document.createElement('div');
      page.className = 'page';
      page.innerHTML = `<p class="order-label">${encabezado}</p>` + buildTable(toRows(chunk));
      pagesEl.appendChild(page);
    }

    document.title = nombre ? `Pedido - ${nombre}` : 'Hoja imprimible - ScanBeat';

    document.getElementById('selector').style.display = 'none';
    document.getElementById('bar').style.display = 'none';
    document.getElementById('printview').style.display = 'block';
    window.scrollTo(0, 0);
  }

  btnGenerate.addEventListener('click', renderPrintView);

  document.getElementById('btnBack').addEventListener('click', () => {
    document.getElementById('printview').style.display = 'none';
    document.getElementById('selector').style.display = 'block';
    document.getElementById('bar').style.display = 'flex';
    document.title = originalTitle;
  });

  document.getElementById('btnPrint').addEventListener('click', () => window.print());

  renderGrid();
  renderSummary();
  updateBar();
</script>
</body>
</html>
