<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Hoja imprimible</title>
<style>
  :root{
    --bg1:#1a1a2e; --bg2:#16213e; --accent:#e94560; --accent2:#ffd166; --text:#ffffff;
  }
  .theme-cumpleanos{ --bg1:#3a0d5c; --bg2:#7b2d8e; --accent:#ff6fb5; --accent2:#ffd166; }
  .theme-fiesta{ --bg1:#0f0c29; --bg2:#302b63; --accent:#00f5d4; --accent2:#f15bb5; }
  .theme-evento{ --bg1:#0b0b0b; --bg2:#1c1c1c; --accent:#d4af37; --accent2:#ffffff; }
  .theme-regalo{ --bg1:#5c0011; --bg2:#8e0e3a; --accent:#ff8fa3; --accent2:#ffd166; }

  * { box-sizing: border-box; }
  @page{ size: A4; margin: 1cm; }
  body{
    margin:0; padding:1cm; background:#e5e5e5;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .sheet{
    display:grid; grid-template-columns:repeat(2, 8.56cm); gap:0.6cm;
    justify-content:center;
  }
  /* Tamaño real de tarjeta de crédito (ISO/IEC 7810 ID-1): 8.56cm x 5.4cm */
  .card{
    width:8.56cm; height:5.4cm; border-radius:0.3cm; overflow:hidden; position:relative;
    background:linear-gradient(160deg, var(--bg2), var(--bg1));
    color:var(--text); display:flex; align-items:center; gap:0.35cm;
    padding:0.3cm 0.35cm; box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  .info{ flex:1; min-width:0; display:flex; flex-direction:column; align-items:flex-start; gap:0.12cm; }
  .cover{
    width:3.2cm; height:3.2cm; border-radius:8px; object-fit:cover;
    box-shadow:0 3px 6px rgba(0,0,0,.4); background:var(--accent); flex-shrink:0;
  }
  .titulo{
    font-size:8.5pt; font-weight:800; line-height:1.15; margin:0;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .instruccion{ font-size:6pt; font-weight:600; opacity:.85; margin:0; }
  .qr-box{ background:#fff; padding:0.12cm; border-radius:6px; flex-shrink:0; }
  .qr-box img{ width:2.7cm; height:2.7cm; display:block; }
  .cut-guide{
    position:absolute; inset:1px; border:1px dashed rgba(255,255,255,.25);
    border-radius:0.3cm; pointer-events:none;
  }

  @media print{
    body{ background:#fff; padding:0; }
    .card{ box-shadow:none; page-break-inside:avoid; }
    .cut-guide{ border-color:#ccc; }
  }
</style>
</head>
<body>
<div class="sheet" id="sheet"></div>
<script>
  const ITEMS = [{"titulo":"Thriller 40","tema":"regalo","qr":"cards/regalo-thriller40/qr.png","cover":"cards/regalo-thriller40/cover.jpg"},{"titulo":"Rarities","tema":"regalo","qr":"cards/roxette-rarities/qr.png","cover":"cards/roxette-rarities/cover.jpg"},{"titulo":"Patricio Rey y sus Redonditos de Ricota","tema":"regalo","qr":"cards/redondos-discografia/qr.png","cover":"cards/redondos-discografia/covers/cover-0.jpg"},{"titulo":"INXS","tema":"regalo","qr":"cards/inxs-discografia/qr.png","cover":"cards/inxs-discografia/covers/cover-0.jpg"}];

  function esc(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  document.getElementById('sheet').innerHTML = ITEMS.map(it => `
    <div class="card theme-${it.tema}">
      <div class="cut-guide"></div>
      <div class="info">
        <img class="cover" src="${it.cover}" alt="">
        <p class="titulo">${esc(it.titulo)}</p>
        <p class="instruccion">📱 Escaneá para escuchar</p>
      </div>
      <div class="qr-box">
        <img src="${it.qr}" alt="QR">
      </div>
    </div>
  `).join('');
</script>
</body>
</html>
