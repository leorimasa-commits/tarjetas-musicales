<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hacer un pedido — ScanBeat</title>
<meta name="description" content="Elegí las discografías que querés y armá tu pedido de tarjetas ScanBeat.">
<meta name="theme-color" content="#1a1a2e">
<style>
  :root{ --bg1:#1a1a2e; --bg2:#16213e; --accent:#e94560; --accent2:#ffd166; --text:#ffffff; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:radial-gradient(circle at 50% 0%, var(--bg2), var(--bg1));
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text); min-height:100vh;
  }
  a{ color:inherit; }
  button{ font-family:inherit; cursor:pointer; }

  main{ max-width:900px; margin:0 auto; padding:36px 20px 100px; }
  header{ text-align:center; margin-bottom:26px; }
  header a.back{ display:inline-block; margin-bottom:10px; font-size:13px; opacity:.6; text-decoration:none; }
  h1{
    margin:0 0 8px; font-size:clamp(24px,6vw,32px); font-weight:800; letter-spacing:-.02em;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  header p{ margin:0; opacity:.7; font-size:14px; max-width:480px; margin:0 auto; }

  #search{
    display:block; width:100%; max-width:420px; margin:22px auto; padding:12px 16px;
    border-radius:12px; border:1px solid rgba(255,255,255,.15); background:rgba(255,255,255,.06);
    color:var(--text); font-size:15px; outline:none;
  }
  #search::placeholder{ color:rgba(255,255,255,.4); }
  #search:focus{ border-color:var(--accent2); }

  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:12px;
    margin-bottom:30px;
  }
  .tile{
    display:block; width:100%; border:2px solid transparent; border-radius:12px; overflow:hidden;
    position:relative; background:#111; padding:0; text-align:left;
  }
  .tile-thumb{ position:relative; width:100%; aspect-ratio:1; overflow:hidden; }
  .tile-thumb img{ width:100%; height:100%; object-fit:cover; display:block; opacity:.9; }
  .tile span{
    display:block; padding:7px 8px 8px; font-size:11px; font-weight:800; line-height:1.3;
    color:var(--text); text-transform:uppercase; letter-spacing:.03em; background:rgba(255,255,255,.05);
  }
  .tile.selected{ border-color:var(--accent2); }
  .tile.selected .tile-thumb::after{
    content:''; position:absolute; top:6px; right:6px; width:22px; height:22px; border-radius:50%;
    background:var(--accent2) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="%23111" d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>') center/14px no-repeat;
    box-shadow:0 2px 6px rgba(0,0,0,.4);
  }
  .tile.selected span{ background:rgba(255,209,102,.15); color:var(--accent2); }
  .empty-msg{ text-align:center; opacity:.5; padding:30px; grid-column:1/-1; font-size:13.5px; }

  #chosen{
    margin-bottom:30px; padding:16px; border-radius:14px; border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.03);
  }
  #chosen h2{ margin:0 0 10px; font-size:14px; font-weight:800; }
  #chosen .empty{ opacity:.5; font-size:13px; margin:0; }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{
    display:inline-flex; align-items:center; gap:6px; padding:5px 6px 5px 10px;
    border-radius:16px; background:rgba(255,255,255,.08); font-size:11.5px; font-weight:700;
    text-transform:uppercase; letter-spacing:.02em;
  }
  .chip button{
    border:none; background:rgba(255,255,255,.15); color:var(--text); width:16px; height:16px;
    border-radius:50%; font-size:10px; line-height:1; display:flex; align-items:center; justify-content:center;
    padding:0;
  }
  .chip button:hover{ background:var(--accent); }

  form.contact{
    display:flex; flex-direction:column; gap:14px; max-width:480px; margin:0 auto;
  }
  form.contact label{ font-size:12.5px; font-weight:700; opacity:.8; display:block; margin-bottom:6px; }
  form.contact input, form.contact textarea{
    display:block; width:100%; padding:12px 14px; border-radius:12px;
    border:1px solid rgba(255,255,255,.15); background:rgba(255,255,255,.06);
    color:var(--text); font-size:15px; font-family:inherit; outline:none;
  }
  form.contact input:focus, form.contact textarea:focus{ border-color:var(--accent2); }
  form.contact textarea{ resize:vertical; min-height:80px; }

  .btn-submit{
    border:none; border-radius:24px; padding:15px 24px; font-weight:800; font-size:15px;
    background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#111;
    box-shadow:0 10px 26px rgba(0,0,0,.4);
  }
  .btn-submit:disabled{ opacity:.4; box-shadow:none; }
  .hint{ font-size:12px; opacity:.55; text-align:center; margin-top:4px; }
</style>
</head>
<body>
<main>
  <header>
    <a class="back" href="./">← Volver</a>
    <h1>Armá tu pedido</h1>
    <p>Elegí las discografías que querés en tu tarjeta y completá tus datos. Te contactamos para coordinar el resto.</p>
  </header>

  <input id="search" type="text" placeholder="Buscar artista…">
  <div class="grid" id="grid"></div>

  <div id="chosen">
    <h2>Tu selección (<span id="count">0</span>)</h2>
    <p class="empty" id="emptyMsg">Todavía no elegiste ninguna discografía.</p>
    <div class="chips" id="chips"></div>
  </div>

  <form class="contact" action="https://formsubmit.co/pedidos@scanbeat.com.ar" method="POST" id="orderForm">
    <input type="hidden" name="_subject" value="Nuevo pedido — ScanBeat">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_captcha" value="true">
    <input type="hidden" name="_next" value="https://scanbeat.com.ar/gracias.html">
    <input type="hidden" name="Discografías elegidas" id="artistsField" value="">
    <div>
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="Nombre" required>
    </div>
    <div>
      <label for="contacto">WhatsApp o email de contacto</label>
      <input type="text" id="contacto" name="Contacto" required>
    </div>
    <div>
      <label for="comentario">Comentario (opcional)</label>
      <textarea id="comentario" name="Comentario" placeholder="Alguna aclaración sobre tu pedido…"></textarea>
    </div>
    <button type="submit" class="btn-submit" id="btnSubmit" disabled>Enviar pedido</button>
    <p class="hint">Te va a llegar una confirmación y te contactamos para coordinar el pago y la entrega.</p>
  </form>
</main>

<script>
  const CARDS = [{"slug":"ariana-grande-discografia","titulo":"Ariana Grande","cover":"cards/ariana-grande-discografia/covers/cover-1oo1wVkwE6SksxdwOLs5uG.jpg"},{"slug":"attaque-77-discografia","titulo":"Attaque 77","cover":"cards/attaque-77-discografia/covers/cover-3cTshAu7QcQXgENefYRlAc.jpg"},{"slug":"bad-bunny-discografia","titulo":"Bad Bunny","cover":"cards/bad-bunny-discografia/covers/cover-7CjJb2mikwAWA1V6kewFBF.jpg"},{"slug":"beyonce-discografia","titulo":"Beyoncé","cover":"cards/beyonce-discografia/covers/cover-06v9eHnqhMK2tbM2Iz3p0Y.jpg"},{"slug":"bruno-mars-discografia","titulo":"Bruno Mars","cover":"cards/bruno-mars-discografia/covers/cover-6J84szYCnMfzEcvIcfWMFL.jpg"},{"slug":"charly-garcia-discografia","titulo":"Charly García","cover":"cards/charly-garcia-discografia/covers/cover-30smSIaIudRfcGGIUn2O2K.jpg"},{"slug":"coldplay-discografia","titulo":"Coldplay","cover":"cards/coldplay-discografia/covers/cover-6ZG5lRT77aJ3btmArcykra.jpg"},{"slug":"depeche-mode-discografia","titulo":"Depeche Mode","cover":"cards/depeche-mode-discografia/covers/cover-1XLkKNbDs4YrfTVZUEZQGs.jpg"},{"slug":"divididos-discografia","titulo":"Divididos","cover":"cards/divididos-discografia/covers/cover-0ZNRl9pxbglsYLKRdSEmz0.jpg"},{"slug":"dua-lipa-discografia","titulo":"Dua Lipa","cover":"cards/dua-lipa-discografia/covers/cover-2vlhlrgMaXqcnhRqIEV9AP.jpg"},{"slug":"fito-paez-discografia","titulo":"Fito Páez","cover":"cards/fito-paez-discografia/covers/cover-0MTUFk4egA3SYvPjjsJUpX.jpg"},{"slug":"gnr-discografia","titulo":"Guns N' Roses","cover":"cards/gnr-discografia/covers/cover-28yHV3Gdg30AiB8h8em1eW.jpg"},{"slug":"inxs-discografia","titulo":"INXS","cover":"cards/inxs-discografia/covers/cover-1j3pV7clfsIYMbMh4vDxAZ.jpg"},{"slug":"justin-bieber-discografia","titulo":"Justin Bieber","cover":"cards/justin-bieber-discografia/covers/cover-1rG5TDs3jYh6OU753I54CI.jpg"},{"slug":"karol-g-discografia","titulo":"Karol G","cover":"cards/karol-g-discografia/covers/cover-12nlJpvrOd7tTOaCxB1UeR.jpg"},{"slug":"kiss-discografia","titulo":"KISS","cover":"cards/kiss-discografia/covers/cover-0NjpmoajQlllfKH9FaNliD.jpg"},{"slug":"lady-gaga-discografia","titulo":"Lady Gaga","cover":"cards/lady-gaga-discografia/covers/cover-1jpUMnKpRlng1OJN7LJauV.jpg"},{"slug":"luis-miguel-discografia","titulo":"Luis Miguel","cover":"cards/luis-miguel-discografia/covers/cover-6JSqwckfTYWbJj4R1fdOOo.jpg"},{"slug":"madonna-discografia","titulo":"Madonna","cover":"cards/madonna-discografia/covers/cover-5lrlWKjNY0eTDXp9Bd3LpW.jpg"},{"slug":"maroon-5-discografia","titulo":"Maroon 5","cover":"cards/maroon-5-discografia/covers/cover-1Rv9WRKyYhFaGbuYDaQunN.jpg"},{"slug":"metallica-discografia","titulo":"Metallica","cover":"cards/metallica-discografia/covers/cover-1aGapZGHBovnmhwqVNI6JZ.jpg"},{"slug":"michael-jackson-discografia","titulo":"Michael Jackson","cover":"cards/michael-jackson-discografia/covers/cover-0F4XW0iBOhNFkbn1BuQ8cu.jpg"},{"slug":"miley-cyrus-discografia","titulo":"Miley Cyrus","cover":"cards/miley-cyrus-discografia/covers/cover-0lB2NEOuH7WRqaWotxmIDH.jpg"},{"slug":"redondos-discografia","titulo":"Patricio Rey y sus Redonditos de Ricota","cover":"cards/redondos-discografia/covers/cover-1yfbnWxr2stypbpB3K0547.jpg"},{"slug":"pet-shop-boys-discografia","titulo":"Pet Shop Boys","cover":"cards/pet-shop-boys-discografia/covers/cover-0M4ETXYQ6hEapPpGf6gRRM.jpg"},{"slug":"pink-floyd-discografia","titulo":"Pink Floyd","cover":"cards/pink-floyd-discografia/covers/cover-2Se4ZylF9NkFGD92yv1aZC.jpg"},{"slug":"queen-discografia","titulo":"Queen","cover":"cards/queen-discografia/covers/cover-5SSpz2RyyEhLt5FDymT4Ph.jpg"},{"slug":"ratones-paranoicos-discografia","titulo":"Ratones Paranoicos","cover":"cards/ratones-paranoicos-discografia/covers/cover-4jiSCesO2MeWBzRze9cfRq.jpg"},{"slug":"rihanna-discografia","titulo":"Rihanna","cover":"cards/rihanna-discografia/covers/cover-19UbDbyaYRW1U7lBMYO9F2.jpg"},{"slug":"roxette-discografia","titulo":"Roxette","cover":"cards/roxette-discografia/covers/cover-4Hz1AOijuFr5o98dfYxvMb.jpg"},{"slug":"shakira-discografia","titulo":"Shakira","cover":"cards/shakira-discografia/covers/cover-3HLngzP9wVd8p3SMDQgyd9.jpg"},{"slug":"soda-stereo-discografia","titulo":"Soda Stereo","cover":"cards/soda-stereo-discografia/covers/cover-3i4nU0OIi7gMmXDEhG9ZRt.jpg"},{"slug":"taylor-swift-discografia","titulo":"Taylor Swift","cover":"cards/taylor-swift-discografia/covers/cover-7mzrIsaAjnXihW3InKjlC3.jpg"},{"slug":"beatles-discografia","titulo":"The Beatles","cover":"cards/beatles-discografia/covers/cover-3KzAvEXcqJKBF97HrXwlgf.jpg"},{"slug":"rolling-stones-discografia","titulo":"The Rolling Stones","cover":"cards/rolling-stones-discografia/covers/cover-7Kln3VdaLUYVIFpqe7AuNA.jpg"},{"slug":"u2-discografia","titulo":"U2","cover":"cards/u2-discografia/covers/cover-2XHksgb0SsUL4NBaqTXHDX.jpg"}];
  const BY_SLUG = Object.fromEntries(CARDS.map(c => [c.slug, c]));

  let selected = [];
  const params = new URLSearchParams(window.location.search);
  const preselect = params.get('artist');
  if (preselect && BY_SLUG[preselect]) selected.push(preselect);

  function esc(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  const gridEl = document.getElementById('grid');
  const searchEl = document.getElementById('search');
  const countEl = document.getElementById('count');
  const chipsEl = document.getElementById('chips');
  const emptyMsgEl = document.getElementById('emptyMsg');
  const artistsFieldEl = document.getElementById('artistsField');
  const btnSubmit = document.getElementById('btnSubmit');

  function renderGrid(){
    const q = searchEl.value.trim().toLowerCase();
    const filtered = q ? CARDS.filter(c => c.titulo.toLowerCase().includes(q)) : CARDS;
    if (!filtered.length) {
      gridEl.innerHTML = '<p class="empty-msg">No hay artistas que coincidan.</p>';
      return;
    }
    gridEl.innerHTML = filtered.map(c => `
      <button type="button" class="tile ${selected.includes(c.slug) ? 'selected' : ''}" data-slug="${c.slug}">
        <div class="tile-thumb">
          ${c.cover ? `<img src="${c.cover}" alt="${esc(c.titulo)}" loading="lazy">` : ''}
        </div>
        <span>${esc(c.titulo)}</span>
      </button>`).join('');
  }

  function renderChosen(){
    countEl.textContent = selected.length;
    emptyMsgEl.style.display = selected.length ? 'none' : 'block';
    chipsEl.innerHTML = selected.map(slug => {
      const c = BY_SLUG[slug];
      return `<span class="chip">${esc(c.titulo)}<button type="button" data-remove="${slug}">×</button></span>`;
    }).join('');
    artistsFieldEl.value = selected.map(slug => BY_SLUG[slug].titulo).join(', ');
    btnSubmit.disabled = selected.length === 0;
  }

  function toggle(slug){
    const i = selected.indexOf(slug);
    if (i === -1) selected.push(slug); else selected.splice(i, 1);
    renderGrid();
    renderChosen();
  }

  gridEl.addEventListener('click', (e) => {
    const tile = e.target.closest('.tile');
    if (!tile) return;
    toggle(tile.dataset.slug);
  });

  chipsEl.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-remove]');
    if (!btn) return;
    toggle(btn.dataset.remove);
  });

  searchEl.addEventListener('input', renderGrid);

  renderGrid();
  renderChosen();
</script>
</body>
</html>
